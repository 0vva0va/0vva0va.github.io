    <!-- FLUID PIXEL DISSOLVE INTRO -->
    <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          window.dispatchEvent(new Event('siteIntroDone'));
          return;
      }

      var CELL      = 12;
      var DELAY_MS  = 120;
      var REVEAL_MS = 1050;
      var FADE_SPAN = 0.38;
      var WAVE_SPAN = 1 - FADE_SPAN;
      var BASE      = '#020409';

      var style = document.createElement('style');
      style.textContent =
        '.boot-intro{position:fixed;inset:0;z-index:99999;pointer-events:none;}' +
        '.boot-intro__canvas{display:block;width:100%;height:100%;}';

      var intro = document.createElement('div');
      intro.className = 'boot-intro';
      intro.setAttribute('aria-hidden', 'true');
      intro.innerHTML = '<canvas class="boot-intro__canvas"></canvas>';

      var canvas, ctx, W, H, cells;
      var startT = null, rafId = null, done = false;

      function build() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var cols = Math.ceil(W / CELL);
        var rows = Math.ceil(H / CELL);
        var halfCols = cols / 2;
        cells = [];

        for (var y = 0; y < rows; y++) {
          for (var x = 0; x < cols; x++) {
            var distFromEdge = x < halfCols ? x : (cols - 1 - x);
            var normDist = distFromEdge / halfCols;
            var jitter = (Math.random() - 0.5) * 0.12;
            var delay = Math.max(0, Math.min(WAVE_SPAN, normDist * WAVE_SPAN + jitter));
            cells.push({ x: x, y: y, delay: delay });
          }
        }
      }

      function ease(t) {
        t = Math.max(0, Math.min(1, t));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      function finish() {
        if (done) return;
        done = true;
        cancelAnimationFrame(rafId);
        intro.remove();
        style.remove();
        window.dispatchEvent(new Event('siteIntroDone'));
      }

      function frame(now) {
        if (startT === null) startT = now;
        var t = Math.max(0, now - startT - DELAY_MS);
        var p = Math.min(1, t / REVEAL_MS);

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = BASE;
        ctx.fillRect(0, 0, W, H);

        ctx.globalCompositeOperation = 'destination-out';
        var glowCells = [];
        for (var i = 0; i < cells.length; i++) {
          var c = cells[i];
          var local = (p - c.delay) / FADE_SPAN;
          if (local <= 0) continue;
          var a = ease(local);
          if (a >= 1) {
            ctx.fillStyle = 'rgba(0,0,0,1)';
            ctx.fillRect(c.x * CELL, c.y * CELL, CELL, CELL);
          } else {
            ctx.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')';
            ctx.fillRect(c.x * CELL, c.y * CELL, CELL, CELL);
            glowCells.push(c);
          }
        }

        ctx.globalCompositeOperation = 'source-over';
        for (var g = 0; g < glowCells.length; g++) {
          var gc = glowCells[g];
          var gl = (p - gc.delay) / FADE_SPAN;
          var intensity = Math.sin(Math.PI * Math.max(0, Math.min(1, gl)));
          ctx.fillStyle = 'rgba(111, 227, 255, ' + (intensity * 0.35).toFixed(3) + ')';
          ctx.fillRect(gc.x * CELL, gc.y * CELL, CELL, CELL);
        }

        if (p > 0.86) {
          var flashP = (p - 0.86) / 0.14;
          var flashAlpha = Math.sin(flashP * Math.PI) * 0.35;
          ctx.fillStyle = 'rgba(255, 255, 255, ' + flashAlpha.toFixed(3) + ')';
          ctx.fillRect(W / 2 - CELL * 2, 0, CELL * 4, H);
        }

        if (p >= 1 && t > REVEAL_MS + 140) {
          finish();
          return;
        }

        rafId = requestAnimationFrame(frame);
      }

      function start() {
        canvas = intro.querySelector('canvas');
        ctx = canvas.getContext('2d');
        build();
        window.addEventListener('resize', function () { if (!done) build(); });
        setTimeout(finish, DELAY_MS + REVEAL_MS + 900);
        rafId = requestAnimationFrame(frame);
      }

      function mount() {
        document.head.appendChild(style);
        document.body.insertBefore(intro, document.body.firstChild);
        start();
      }

      if (document.body) mount();
      else document.addEventListener('DOMContentLoaded', mount);
    })();
    </script>

        function glowTexture() {
          const c  = document.createElement("canvas");
          c.width  = c.height = 128;
          const g  = c.getContext("2d");
          const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
          gr.addColorStop(0, "rgba(255,255,255,1)");
          gr.addColorStop(0.35, "rgba(255,255,255,.5)");
          gr.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = gr;
          g.fillRect(0, 0, 128, 128);
          return new THREE.CanvasTexture(c);
        }
        const texGlow = glowTexture();

        function drawGlyph(g, type, s) {
          g.lineWidth = Math.max(1.2, s * 0.16);
          g.lineCap = "round";
          g.lineJoin = "round";
          g.beginPath();
          if (type === "person") {
            g.arc(0, -s * 0.42, s * 0.3, 0, 7);
            g.stroke();
            g.beginPath();
            g.arc(0, s * 0.75, s * 0.62, Math.PI * 1.15, Math.PI * 1.85);
            g.stroke();
          } 
          else if (type === "target") {
            g.arc(0, 0, s * 0.55, 0, 7);
            g.stroke();
            g.beginPath();
            g.moveTo(0, -s * 0.95); g.lineTo(0, -s * 0.62);
            g.moveTo(0, s * 0.95); g.lineTo(0, s * 0.62);
            g.moveTo(-s * 0.95, 0); g.lineTo(-s * 0.62, 0);
            g.moveTo(s * 0.95, 0); g.lineTo(s * 0.62, 0);
            g.stroke();
            g.beginPath();
            g.arc(0, 0, s * 0.12, 0, 7);
            g.fill();
          } 
          else if (type === "chevron") {
            for (let k = 0; k < 3; k++) {
              const y = -s * 0.45 + k * s * 0.45;
              g.moveTo(-s * 0.55, y + s * 0.3);
              g.lineTo(0, y - s * 0.15);
              g.lineTo(s * 0.55, y + s * 0.3);
            }
            g.stroke();
          } 
          else if (type === "doc") {
            g.rect(-s * 0.42, -s * 0.55, s * 0.84, s * 1.1);
            g.stroke();
            g.beginPath();
            for (let k = 0; k < 3; k++) {
              const y = -s * 0.25 + k * s * 0.25;
              g.moveTo(-s * 0.24, y);
              g.lineTo(s * 0.24, y);
            }
            g.stroke();
          } 
          else if (type === "signal") {
            g.arc(0, s * 0.5, s * 0.1, 0, 7);
            g.fill();
            g.beginPath();
            for (const r of [0.35, 0.62, 0.88])
              g.arc(0, s * 0.5, s * r, -Math.PI * 0.82, -Math.PI * 0.18);
            g.stroke();
          } 
          else if (type === "link") {
            g.arc(-s * 0.28, 0, s * 0.34, 0, 7);
            g.stroke();
            g.beginPath();
            g.arc(s * 0.28, 0, s * 0.34, 0, 7);
            g.stroke();
          }
          else if (type === "cube") {
            g.moveTo(0, -s * 0.62);
            g.lineTo(s * 0.56, 0);
            g.lineTo(0, s * 0.62);
            g.lineTo(-s * 0.56, 0);
            g.closePath();
            g.stroke();
            g.beginPath();
            g.moveTo(-s * 0.56, 0); g.lineTo(s * 0.56, 0);
            g.moveTo(0, -s * 0.62); g.lineTo(0, s * 0.62);
            g.stroke();
          }
        }

        function hexPathOn(g, x, y, r) {
          g.beginPath();
          for (let k = 0; k < 6; k++) {
            const a  = (k * Math.PI) / 3 + Math.PI / 6;
            const px = x + Math.cos(a) * r,
                  py = y + Math.sin(a) * r;
            k ? g.lineTo(px, py) : g.moveTo(px, py);
          }
          g.closePath();
        }

        function makeNodeTexture(sec) {
          const c  = document.createElement("canvas");
          c.width  = c.height = 256;
          const g  = c.getContext("2d");
          const cx = 128, cy = 96, hr = 84;
          g.shadowColor = "rgba(120,220,255,.95)";
          g.shadowBlur = 15;
          hexPathOn(g, cx, cy, hr);
          g.fillStyle = "rgba(6,18,42,.85)";
          g.fill();
          g.strokeStyle = "rgba(150,230,255,.95)";
          g.lineWidth = 3;
          g.stroke();
          g.shadowBlur = 0;
          hexPathOn(g, cx, cy, hr - 8);
          g.strokeStyle = "rgba(120,220,255,.28)";
          g.lineWidth = 1.5;
          g.stroke();
          g.save();
          g.translate(cx, cy);
          g.strokeStyle = g.fillStyle = "rgba(235,250,255,.96)";
          g.shadowColor = "rgba(140,225,255,.9)";
          g.shadowBlur = 10;
          drawGlyph(g, sec.icon, hr * 0.42);
          g.restore();
          g.font = "34px VT323, monospace";
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.shadowColor = "rgba(120,220,255,.8)";
          g.shadowBlur = 12;
          g.fillStyle = "rgba(200,240,255,.95)";
          g.font = '28px DisplayFont_LandingHeadings, monospace';
          g.fillText(sec.name, 128, 226);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          return tex;
        }

        function makeReticleTexture() {
          const c = document.createElement("canvas");
          c.width = c.height = 256;
          const g = c.getContext("2d");
          g.strokeStyle = "rgba(200,230,255,0.9)";
          g.shadowColor = "rgba(150,200,255,.6)";
          g.shadowBlur  = 8;
          g.lineWidth   = 3;
          g.setLineDash([18, 14]);
          g.beginPath();
          g.arc(128, 128, 96, 0, 7);
          g.stroke();
          g.setLineDash([]);
          for (let k = 0; k < 4; k++) {
            const a = (k * Math.PI) / 2 + Math.PI / 4;
            g.beginPath();
            g.moveTo(128 + Math.cos(a) * 106, 128 + Math.sin(a) * 106);
            g.lineTo(128 + Math.cos(a) * 122, 128 + Math.sin(a) * 122);
            g.stroke();
          }
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          return tex;
        }

          vertexShader: `
            varying vec2 vUv; varying vec3 vN; varying vec3 vV;
            void main(){
              vUv=uv;
              vN=normalize(normalMatrix*normal);
              vec4 mv=modelViewMatrix*vec4(position,1.0);
              vV=-mv.xyz;
              gl_Position=projectionMatrix*mv;
            }`,
          fragmentShader: `
            uniform float uTime; uniform float uPulse; uniform float uDim;
            varying vec2 vUv; varying vec3 vN; varying vec3 vV;
            float line(float x){ float d=abs(fract(x)-0.5); return smoothstep(0.38,0.5,d); }
            void main(){
              vec3 nv=normalize(vN), vv=normalize(vV);
              float lit=0.45+0.55*clamp(dot(nv,vv),0.,1.);
              float seams=line(vUv.x*18.0);
              float bands=line(vUv.y*28.0);
              float ribs =line(vUv.y*6.0);
              float pulse=0.65+0.35*sin(vUv.y*12.566 - uPulse);
              float fres =pow(1.0-abs(dot(nv,vv)),1.6);
              float menuBand=exp(-pow((vUv.y-0.5)*11.0,2.0));
              vec3 base=vec3(0.03,0.05,0.08)*(0.7+0.3*vUv.y);
              vec3 cyan=vec3(0.4,0.75,1.0);
              vec3 highlight=vec3(0.9, 0.95, 1.0);
              vec3 glow= cyan*((seams*0.5+bands*0.32)*pulse+ribs*0.85)
                       + highlight*menuBand*0.4
                       + cyan*fres*0.3;
              gl_FragColor=vec4((base+glow*uDim)*lit,1.0);
            }`,
        });
        trunkGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(trunkR, trunkR, trunkH, 72, 36, true), trunkMat));

        const capT = new THREE.Mesh(new THREE.CircleGeometry(trunkR, 72), capMat);

        beam1.scale.set(80, 1250, 1);

        const beam2 = new THREE.Sprite(new THREE.SpriteMaterial({

        beam2.scale.set(26, 1250, 1);

        const capGlowT = new THREE.Sprite(new THREE.SpriteMaterial({

        function arcRing(radius, y, speed, tilt) {
          const grp = new THREE.Group();
          const mat = new THREE.MeshBasicMaterial({
            color: 0x6fd2ff, transparent: true, opacity: 0.4,
            blending: THREE.AdditiveBlending, depthWrite: false,
          });
          for (let k = 0; k < 3; k++) {
            const arc = new THREE.Mesh(new THREE.TorusGeometry(radius, 1.4, 8, 32, 1.7), mat);
            arc.rotation.z = (k * Math.PI * 2) / 3;
            grp.add(arc);
          }
          grp.rotation.x = Math.PI / 2 + tilt;
          grp.position.y = y;
          grp.userData.speed = speed;
          scene.add(grp);
          return grp;

        const orbit1 = arcRing(172, 168, 0.28, 0.1);
        const orbit2 = arcRing(156, -186, -0.19, -0.08);

        const NP = 420;
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NP * 3), 3));
        const aA = new Float32Array(NP), aR = new Float32Array(NP), aY = new Float32Array(NP),
          aSp = new Float32Array(NP), aSz = new Float32Array(NP), aW = new Float32Array(NP);
        for (let i = 0; i < NP; i++) {
          aA[i] = Math.random() * Math.PI * 2;
          aR[i] = trunkR + 8 + Math.random() * 70;
          aY[i] = Math.random() * 640;
          aSp[i] = 22 + Math.random() * 52;
          aSz[i] = 2.5 + Math.random() * 3.5;
          aW[i] = Math.random() < 0.14 ? 1 : 0;
        }
        pGeo.setAttribute("aA", new THREE.BufferAttribute(aA, 1));
        pGeo.setAttribute("aR", new THREE.BufferAttribute(aR, 1));
        pGeo.setAttribute("aY", new THREE.BufferAttribute(aY, 1));
        pGeo.setAttribute("aSp", new THREE.BufferAttribute(aSp, 1));
        pGeo.setAttribute("aSz", new THREE.BufferAttribute(aSz, 1));
        pGeo.setAttribute("aW", new THREE.BufferAttribute(aW, 1));

        const pMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uFlow: { value: 0 }, uPx: { value: 1 }, uDim: { value: 1 }, uBoost: { value: 1 } },
          vertexShader: `
            attribute float aA; attribute float aR; attribute float aY;
            attribute float aSp; attribute float aSz; attribute float aW;
            uniform float uTime; uniform float uFlow; uniform float uPx;
            varying float vW; varying float vA;
            void main(){
              float y=mod(aY + uFlow*aSp, 640.0) - 320.0;
              float ang=aA + uTime*(0.15 + 0.12*aW);
              vec3 p=vec3(cos(ang)*aR, y, sin(ang)*aR);
              vec4 mv=modelViewMatrix*vec4(p,1.0);
              gl_PointSize=aSz*uPx/max(1.0,-mv.z);
              vW=aW;
              vA=smoothstep(-320.0,-230.0,y)*smoothstep(320.0,230.0,y);
              gl_Position=projectionMatrix*mv;
            }`,
          fragmentShader: `
            varying float vW; varying float vA;
            uniform float uDim; uniform float uBoost;
            void main(){
              float d=length(gl_PointCoord-0.5);
              float a=smoothstep(0.5,0.06,d)*vA*uDim;
              vec3 col=mix(vec3(0.4,0.75,1.0), vec3(1.0, 1.0, 1.0), vW);
              gl_FragColor=vec4(col*a*uBoost, a*uBoost);
            }`,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        });
        const points = new THREE.Points(pGeo, pMat);
        points.frustumCulled = false;
        scene.add(points);

        (function () {
          const y = -310,
            mat1 = new THREE.LineBasicMaterial({ color: 0x6fd2ff, transparent: true, opacity: 0.07 });
          for (const rad of [190, 290, 410, 560, 900]) {

              pts[k * 3] = Math.cos(a) * rad;
              pts[k * 3 + 1] = y;
              pts[k * 3 + 2] = Math.sin(a) * rad;

            scene.add(new THREE.Line(g, mat1));
          }
          const tp = new Float32Array(24 * 6);
          for (let k = 0; k < 24; k++) {
            const a = (k * Math.PI) / 12;

            tp[k * 6 + 2] = Math.sin(a) * 560;
            tp[k * 6 + 3] = Math.cos(a) * 590;
            tp[k * 6 + 4] = y;
            tp[k * 6 + 5] = Math.sin(a) * 590;

          const tg = new THREE.BufferGeometry();

          scene.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({ color: 0x6fd2ff, transparent: true, opacity: 0.12 })));

        (function () {
          const sp = new Float32Array(500 * 3);
          for (let i = 0; i < 500; i++) {

        })();

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

        let tipActive = false, tipTimer = 0;

          document.body.classList.add("show-tip");

        function dismissTip(persist) {
          if (!tipActive) return;
          tipActive = false;
          clearTimeout(tipTimer);
          document.body.classList.remove("show-tip");
          if (persist) lsSet("helios_tip_seen", "1");
        }

        let rotA = -Math.PI / 2, tw = null, activeIdx = 0, hoverIdx = -1;
        let isOpen = false, openSeq = 0, time = 0, dim = 1, camZ = CAM.z;
        let swayMix = 0, mouseX = 0, mouseY = 0;
        const tmpV = new THREE.Vector3(), tmpW = new THREE.Vector3(), lookT = new THREE.Vector3();
        const iconScr = Array.from({ length: N }, () => ({ i: 0, x: 0, y: 0, r: 0, hidden: true }));
        let iconCount = 0;

        let pulseT = 0, flowT = 0;

        function activeFromRot() {
          return ((Math.round((rotA + Math.PI / 2) / DELTA) % N) + N) % N;
        }
        function rotateTo(i, durOverride) {
          if (isOpen || !introDone) return;
          dismissTip(true);
          const base = i * DELTA - Math.PI / 2;
          const target = base + Math.PI * 2 * Math.round((rotA - base) / (Math.PI * 2));
          const d = durOverride !== undefined ? durOverride
            : Math.min(1200, 620 + Math.abs(target - rotA) * 60);

        const panel = $("panel"), pBody = $("p-body");
        let typer = null;
        function startType(el, text, done) {
          stopType();
          let i = 0;
          el.textContent = "";
          typer = { el, text, done, iv: setInterval(() => {
            i++;
            el.textContent = text.slice(0, i);
            if (i >= text.length) { const d = typer.done; stopType(); d && d(); }
          }, 13) };
        }
        function stopType() { if (typer) { clearInterval(typer.iv); typer = null; } }
        function skipType() {
          if (!typer) return;
          const { el, text, done } = typer;
          stopType();
          el.textContent = text;
          done && done();
        }
        
        function esc(s) {
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        /* ---- skills torus ---- */
        let torus = null;
        function stopTorus() {
          if (torus && torus.raf) cancelAnimationFrame(torus.raf);
          torus = null;
        }
        function startTorus(canvas, skills) {
          if (!canvas || !canvas.isConnected) return;
          stopTorus();
          const ctx = canvas.getContext('2d');
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          let w = canvas.clientWidth, h = canvas.clientHeight;
          if (!w) w = 560;
          if (!h) h = 300;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const n = skills.length;
          const R = Math.min(w, h) * 0.30; // major radius
          const r = Math.min(w, h) * 0.13; // minor radius
          const pts = [];
          for (let i = 0; i < n; i++) {
            const u = (i / n) * Math.PI * 2;
            const v = u * 2 + i * 0.9;
            pts.push({ u, v, label: skills[i], phase: Math.random() * Math.PI * 2 });
          }
          const ctrl = { canvas, ctx, w, h, pts, R, r, raf: null, last: performance.now(), t: Math.random() * 10 };
          torus = ctrl;

          function frame(now) {
            if (!torus || torus !== ctrl) return;
            const dt = Math.min(0.05, (now - ctrl.last) / 1000);
            ctrl.last = now;
            ctrl.t += dt;
            const t = ctrl.t;
            const { ctx, w, h, R, r } = ctrl;
            ctx.clearRect(0, 0, w, h);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 0;

            const rotX = 1.05 + Math.sin(t * 0.35) * 0.18; // tilt
            const rotY = t * 0.6;                            // spin
            const cx = w / 2;
            const cy = h / 2 + Math.sin(t * 0.8) * 5;       // gentle float
            const fov = 520;

            const items = [];
            for (const p of ctrl.pts) {
              const bob = Math.sin(t * 1.5 + p.phase) * 7;
              const cvv = Math.cos(p.v), sv = Math.sin(p.v);
              const cu = Math.cos(p.u), su = Math.sin(p.u);
              let x = (R + r * cvv) * cu;
              let y = (R + r * cvv) * su;
              let z = r * sv + bob;
              // rotate X
              let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
              let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
              let x1 = x;
              // rotate Y
              let x2 = x1 * Math.cos(rotY) + z1 * Math.sin(rotY);
              let z2 = -x1 * Math.sin(rotY) + z1 * Math.cos(rotY);
              let y2 = y1;
              const scale = fov / (fov + z2);
              items.push({ label: p.label, sx: cx + x2 * scale, sy: cy + y2 * scale, scale });
            }
            items.sort((a, b) => a.scale - b.scale); // back to front
            for (const it of items) {
              const nd = Math.max(0, Math.min(1, (it.scale - 0.82) / 0.45));
              const size = 12 + nd * 10;
              const alpha = 0.28 + nd * 0.72;
              const rr = Math.round(70 + (235 - 70) * nd);
              const gg = Math.round(110 + (248 - 110) * nd);
              const bb = Math.round(150 + (255 - 150) * nd);
              ctx.font = Math.round(size) + 'px "VT323", monospace';
              if (nd > 0.72) { ctx.shadowColor = "rgba(140,225,255,0.8)"; ctx.shadowBlur = 10; }
              else ctx.shadowBlur = 0;
              ctx.fillStyle = `rgba(${rr},${gg},${bb},${alpha.toFixed(3)})`;
              ctx.fillText(it.label, it.sx, it.sy);
            }
            ctrl.raf = requestAnimationFrame(frame);
          }
          ctrl.raf = requestAnimationFrame(frame);
        }

        function makeRow(r) {
          const el = document.createElement("div");
          if (r.t === "kv") {
            el.className = "row" + (r.href ? " link" : "");
            const k = document.createElement("span");
            k.className = "k";
            k.textContent = r.k;
            const v = document.createElement(r.href ? "a" : "span");
            v.className = "v";
            v.textContent = r.v;
            if (r.href) {
              v.href = r.href;
              if (/^http/.test(r.href)) { v.target = "_blank"; v.rel = "noopener"; }
            }
            el.append(k, v);
          } else if (r.t === "hd") {
            el.className = "hd";
            el.textContent = r.v;
          } else if (r.t === "pa") {
            el.className = "para";
            el.textContent = r.v;
          } else if (r.t === "bar") {
            el.className = "row bar-row";
            el.innerHTML = `<div class="lbl"><span>${esc(r.k)}</span><span>${esc(r.v)}%</span></div><div class="bar"><i></i></div>`;
            requestAnimationFrame(() => requestAnimationFrame(() => {
              el.querySelector("i").style.width = r.v + "%";
            }));
          } 
          else if (r.t === "li") {
            el.className = "row li";
            const link = r.href
              ? `<a class="li-taglink" href="${esc(r.href)}"${/^http/.test(r.href) ? ' target="_blank" rel="noopener"' : ''}>${esc(r.tag || "MORE")} ↗</a>`
              : "";
            el.innerHTML =
              `<div class="li-main"><span class="li-title">${esc(r.title)}</span><span class="li-meta">${esc(r.meta)}</span></div>` +
              `<div class="li-desc">${esc(r.desc)}</div>` + link;
          }
          else if (r.t === "torus") {
            el.className = "row torus-wrap";
            const cv2 = document.createElement("canvas");
            cv2.className = "torus-canvas";
            el.appendChild(cv2);
            requestAnimationFrame(() => requestAnimationFrame(() => startTorus(cv2, r.skills)));
          }
          else if (r.t === "en") {
            el.className = "row entry";
            el.innerHTML =
              `<span class="t">${esc(r.title)}</span><div class="m">${esc(r.meta)}</div><div class="d">${r.desc}</div>` +
              (r.tags ? `<div>${r.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : "");
          }
          else if (r.type === "video") {
            el.className = "panel-video-wrap";
            if (r.title) {
              const title = document.createElement("div");
              title.className = "hd";
              title.textContent = r.title;
              el.appendChild(title);
            }
            const video = document.createElement("video");
            video.className = "panel-video";
            video.src = r.src;
            video.controls = true;
            video.playsInline = true;
            if (r.poster) video.poster = r.poster;
            if (r.loop) video.loop = true;
            if (r.autoplay) video.autoplay = true;
            el.appendChild(video);
          }
          return el;
        }

        function openMenu(i) {
          dismissTip(true);
          stopTorus();
          const sec = SECTIONS[i], d = DATA[sec.id], seq = ++openSeq;
          isOpen = true;
          document.body.classList.add("menu-open");
          panel.classList.add("open");
          $("p-title").textContent = d.title;
          pBody.scrollTop = 0;
          pBody.innerHTML = "";
          d.rows.forEach((r, k) =>
            setTimeout(() => {
              if (seq !== openSeq) return;
              pBody.appendChild(makeRow(r));
            }, k * 95),
          );
        }
        function closeMenu() {
          if (!isOpen) return;
          isOpen = false;
          openSeq++;
          stopType();
          stopTorus();
          document.body.classList.remove("menu-open");
          panel.classList.remove("open");
          document.querySelectorAll(".panel-video").forEach(v => { v.pause(); });
        }
        $("p-close").addEventListener("click", closeMenu);
        pBody.addEventListener("click", skipType);

        function pick(x, y) {
          let best = -1, bd = 1e9;
          for (let n = 0; n < iconCount; n++) {
            const it = iconScr[n];
            if (it.hidden) continue;
            const d = Math.hypot(x - it.x, y - it.y);
            if (d < it.r && d < bd) { bd = d; best = it.i; }
          }
          return best;
        }
        let dragging = false, dragMoved = 0, lastPX = 0, activePointer = null;
        cv.addEventListener("pointerdown", (e) => {
          if (!introDone || isOpen || e.button !== 0 || activePointer !== null) return;
          activePointer = e.pointerId;
          dragging = true;
          dragMoved = 0;
          lastPX = e.clientX;
          cv.setPointerCapture(e.pointerId);
          cv.classList.add("grabbing");
        });
        cv.addEventListener("pointermove", (e) => {
          if (dragging && e.pointerId === activePointer) {
            const dx = e.clientX - lastPX;
            lastPX = e.clientX;
            dragMoved += Math.abs(dx);
            if (dragMoved > 4) {
              tw = null;
              rotA += dx * ((Math.PI * 2 * DRAG_TURNS_PER_FULLSWIPE) / w);
              dismissTip(true);
            }
            return;
          }
          mouseX = e.clientX / w - 0.5;
          mouseY = e.clientY / h - 0.5;
          if (isOpen) { hoverIdx = -1; return; }
          const hit = pick(e.clientX, e.clientY);
          hoverIdx = hit;
          cv.style.cursor = hit >= 0 ? "pointer" : "grab";
        });
        function endDrag(e) {
          if (!dragging || e.pointerId !== activePointer) return;
          dragging = false;
          activePointer = null;
          cv.classList.remove("grabbing");
          if (dragMoved <= 5) {
            const hit = pick(e.clientX, e.clientY);
            if (hit >= 0) { hit === activeIdx ? openMenu(hit) : rotateTo(hit); }
          } else {
            rotateTo(activeFromRot(), 280);
          }
          cv.style.cursor = "grab";
        }
        cv.addEventListener("pointerup", endDrag);
        cv.addEventListener("pointercancel", endDrag);

        let wheelLock = 0;
        addEventListener("wheel", (e) => {
          if (isOpen || !introDone) return;
          const n = performance.now();
          if (n - wheelLock < 200 || Math.abs(e.deltaY) < 12) return;
          wheelLock = n;
          rotateTo(activeIdx + (e.deltaY > 0 ? 1 : -1));
        }, { passive: true });
        function toggleFS() {
          if (!document.fullscreenElement)
            document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
          else document.exitFullscreen && document.exitFullscreen();
        }

        document.addEventListener("keydown", (e) => {
          if (!introDone) return;
          if (e.key === "Escape") closeMenu();
          else if (e.key === "ArrowRight") rotateTo(activeIdx + 1);
          else if (e.key === "ArrowLeft") rotateTo(activeIdx - 1);
          else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            isOpen ? closeMenu() : openMenu(activeIdx);
          } else if (/^[1-6]$/.test(e.key)) {
            const i = +e.key - 1;
            i === activeIdx ? openMenu(i) : rotateTo(i);
          } else if (e.key === "f" || e.key === "F") toggleFS();
        });

        const elClock = $("clock");
        setInterval(() => {
          const d = new Date(), p = (n) => String(n).padStart(2, "0");
          elClock.textContent = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }, 250);
        onActive();

        addEventListener("resize", () => {
          w = innerWidth;
          h = innerHeight;
          calcInternal();
          camera.aspect = IW / IH;
          camera.updateProjectionMatrix();
          renderer.setSize(IW, IH, false);
          composer.setSize(IW, IH);
          pf = (IH * 0.5) / Math.tan(THREE.MathUtils.degToRad(FOV * 0.5));
        });

        pMat.uniforms.uPx.value = pf;
        if (REDUCED) {
          document.body.classList.add("intro-done");
          setTimeout(maybeShowTip, 400);
        }
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          time += dt;

          if (tw) {
            const k = (now - tw.t0) / tw.dur;
            if (k >= 1) { rotA = tw.a1; tw = null; }
            else {
              const e = 1 - Math.pow(1 - k, 3);
              rotA = tw.a0 + (tw.a1 - tw.a0) * e;
            }
          } else if (!dragging && introDone) {
            rotA = ((((rotA + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) - Math.PI;
          }
          const ai = activeFromRot();
          if (ai !== activeIdx) { activeIdx = ai; onActive(); }

          dim += ((isOpen ? 0.55 : 1) - dim) * Math.min(1, dt * 6);

          flowT += dt;
          pulseT += dt * 1.1;

          trunkMat.uniforms.uTime.value = time;
          trunkMat.uniforms.uPulse.value = pulseT;
          trunkMat.uniforms.uDim.value = dim;
          capMat.uniforms.uDim.value = dim;
          pMat.uniforms.uTime.value = time;
          pMat.uniforms.uFlow.value = flowT;
          pMat.uniforms.uDim.value = dim;
          pMat.uniforms.uBoost.value = 1;

          bloomPass.strength = BLOOM.strength;

          beam1.material.opacity = dim * 0.26;
          beam2.material.opacity = dim * 0.42;
          capGlowT.material.opacity = dim * 0.4;
          capGlowB.material.opacity = dim * 0.3;

          orbit1.rotation.y += dt * orbit1.userData.speed;
          orbit2.rotation.y += dt * orbit2.userData.speed;

          for (let i = 0; i < N; i++) {
            const phi = i * DELTA;
            const f = (Math.cos(phi - rotA - Math.PI / 2) + 1) / 2;
            const act = i === activeIdx;
            nodeSprites[i].position.y = Math.sin(time * 1.8 + i * 1.7) * 3 * SWAY;
            const target = nodeSize * (act ? 1.22 : 1);
            const s = nodeSprites[i].scale.x + (target - nodeSprites[i].scale.x) * Math.min(1, dt * 8);
            nodeSprites[i].scale.set(s, s, 1);
            nodeSprites[i].material.opacity = Math.min(1,
              dim * (0.4 + 0.6 * f) + (act ? 0.15 : 0) + (i === hoverIdx ? 0.15 : 0));
          }
          if (!isOpen && introDone) {
            reticle.visible = true;
            reticle.material.rotation -= dt * 0.7;
            reticle.material.opacity = 0.95 * dim;
            const wobble = 1 + 0.05 * Math.sin(time * 4);
            reticle.scale.setScalar(nodeSize * 1.3 * wobble);
          } else reticle.visible = false;

          trunkGroup.rotation.y = rotA;
          trunkGroup.position.y = Math.sin(time * 0.6) * 5.0;
          trunkGroup.rotation.z = Math.sin(time * 0.4) * 0.012;
          trunkGroup.rotation.x = Math.cos(time * 0.5) * 0.008;

          swayMix += ((dragging || isOpen ? 0 : 1) - swayMix) * Math.min(1, dt * 4);
          const sw = SWAY * swayMix;
          camZ += ((isOpen && w > 760 ? 760 : CAM.z) - camZ) * Math.min(1, dt * 5);
          camera.position.set(
            Math.sin(time * 0.22) * 4 * sw,
            CAM.y + Math.sin(time * 0.31) * 3 * sw,
            camZ,
          );
          lookT.set(-mouseX * 70 * swayMix, 6 - mouseY * 50 * swayMix, 0);
          camera.lookAt(lookT);

          iconCount = 0;
          for (let i = 0; i < N; i++) {
            nodeSprites[i].getWorldPosition(tmpW);
            tmpV.copy(tmpW).project(camera);
            if (tmpV.z < 1) {
              const phi = i * DELTA;
              const f = (Math.cos(phi - rotA - Math.PI / 2) + 1) / 2;
              const it = iconScr[iconCount++];
              it.i = i;
              it.x = ((tmpV.x + 1) / 2) * w;
              it.y = ((1 - tmpV.y) / 2) * h;
              it.r = Math.max(36, (nodeSprites[i].scale.x * 0.8 * pf) / camera.position.distanceTo(tmpW)) * (h / IH);
              it.hidden = f < 0.22;
            }
          }

          composer.render();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        document.body.classList.add("on");
      }
    </script>
  </body>

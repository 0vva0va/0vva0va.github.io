<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mitchell J :: Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cyan: #6fe3ff;
        --cyan2: #9fdcff;
        --amber: #ffb45e;
        --text: #d8f4ff;
      }
      @font-face {
        font-family: "DisplayFont_LandingStats";
        src: local("GROUT-Display"),
              url("fonts/GROUT-Display.woff2") format("woff2");
      }
      @font-face {
        font-family: "DisplayFont_MenuText";
        src: local("Emotion-Engine"),
              url("fonts/Emotion-Engine.woff") format("woff");
      }
      @font-face {
        font-family: "DisplayFont_LandingHeadings";
        src: local("Voyage-Fant"),
              url("fonts/voyagefantstraight.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #020409;
        color: var(--text);
        font-family: "DisplayFont_LandingStats", monospace;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: grab;
      }
      #scene.grabbing {
        cursor: grabbing;
      }

      .hud {
        position: fixed;
        z-index: 40;
        pointer-events: none;
        font-size: 15px;
        line-height: 1.6;
        letter-spacing: 0.12em;
        color: var(--cyan2);
        text-shadow: 0 0 6px rgba(80, 190, 255, 0.55);
        opacity: 0;
        transition: opacity 0.9s ease 0.2s;
      }
      body.on .hud {
        opacity: 1;
      }
      #hud-tl {
        top: 16px;
        left: 20px;
      }
      #hud-tr {
        top: 16px;
        right: 20px;
        text-align: right;
      }
      #hud-bl {
        bottom: 18px;
        left: 20px;
        font-size: 13px;
        color: #6fa8c8;
      }
      #hud-br {
        bottom: 18px;
        right: 20px;
        font-size: 13px;
        color: #6fa8c8;
        text-align: right;
      }
      .dot {
        color: #7dffb0;
        animation: blink 1.3s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }
      #sndbtn,
      #musbtn {
        pointer-events: auto;
        cursor: pointer;
        color: var(--cyan);
      }
      #sndbtn:hover,
      #musbtn:hover {
        color: #fff;
      }
      #trackname {
        color: #54809c;
      }

      #sect {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.1s ease 0.15s;
      }
      body.intro-done #sect {
        opacity: 1;
      }
      #sect .code {
        font-size: 14px;
        color: var(--amber);
        letter-spacing: 0.5em;
        text-shadow: 0 0 8px rgba(255, 180, 94, 0.5);
      }
      #sect .name {
        font-size: 40px;
        letter-spacing: 0.4em;
        color: #eaf9ff;
        text-shadow:
          0 0 14px rgba(120, 220, 255, 0.85),
          0 0 2px #fff;
        padding-left: 0.4em;
      }
      #sect .name.flash {
        animation: sectflash 0.45s ease;
      }
      @keyframes sectflash {
        0% {
          opacity: 0;
          transform: translateY(7px);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      #sect .hint {
        margin-top: 4px;
        font-size: 13px;
        letter-spacing: 0.24em;
        color: #54809c;
      }

      #tip {
        position: fixed;
        left: 50%;
        bottom: 27%;
        transform: translateX(-50%);
        z-index: 44;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      body.show-tip #tip {
        opacity: 1;
      }
      #tip .t1 {
        font-size: 22px;
        letter-spacing: 0.34em;
        color: #eaf9ff;
        text-shadow:
          0 0 12px rgba(120, 220, 255, 0.9),
          0 0 2px #fff;
        animation: tippulse 1.7s ease-in-out infinite;
      }
      #tip .t2 {
        margin-top: 6px;
        font-size: 14px;
        letter-spacing: 0.26em;
        color: #54809c;
      }
      @keyframes tippulse {
        50% {
          opacity: 0.35;
        }
      }

      #controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translate(-50%, 14px);
        z-index: 45;
        display: flex;
        gap: 14px;
        opacity: 0;
        transition:
          opacity 0.9s ease 0.4s,
          transform 0.9s ease 0.4s;
      }
      body.intro-done #controls {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      body.menu-open #controls {
        opacity: 0;
        pointer-events: none;
      }
      .btn {
        font-family: "VT323", monospace;
        font-size: 17px;
        letter-spacing: 0.28em;
        color: var(--text);
        padding: 9px 22px 9px 26px;
        cursor: pointer;
        border: 1px solid rgba(120, 220, 255, 0.55);
        background: linear-gradient(
          180deg,
          rgba(28, 78, 140, 0.85),
          rgba(9, 30, 66, 0.92)
        );
        clip-path: polygon(
          12px 0,
          100% 0,
          100% calc(100% - 12px),
          calc(100% - 12px) 100%,
          0 100%,
          0 12px
        );
        text-shadow: 0 0 7px rgba(120, 220, 255, 0.5);
        transition:
          background 0.15s,
          color 0.15s,
          filter 0.15s;
      }
      .btn:hover {
        background: linear-gradient(
          180deg,
          rgba(64, 146, 224, 0.9),
          rgba(18, 58, 118, 0.95)
        );
        color: #fff;
        filter: drop-shadow(0 0 8px rgba(100, 210, 255, 0.55));
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:focus-visible {
        outline: 1px solid var(--amber);
        outline-offset: 3px;
      }
      .btn.primary {
        border-color: rgba(255, 180, 94, 0.7);
        color: #ffe0b0;
        background: linear-gradient(
          180deg,
          rgba(120, 70, 20, 0.8),
          rgba(58, 32, 8, 0.9)
        );
        text-shadow: 0 0 8px rgba(255, 180, 94, 0.6);
      }
      .btn.primary:hover {
        filter: drop-shadow(0 0 9px rgba(255, 180, 94, 0.55));
        color: #fff;
      }

      .panel-video-wrap {
        padding: 1rem 0;
        max-width: 720px;
      }

      .panel-video {
        width: 100%;
        border: 1px solid rgba(111, 227, 255, 0.3);
        border-radius: 2px;
        background: #000;
        outline: none;
      }

      .panel-video:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 12px rgba(111, 227, 255, 0.25);
      }

      .video-unmute-btn {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        font-family: 'VT323', monospace;
        font-size: 16px;
        letter-spacing: 0.12em;
        color: var(--cyan);
        background: rgba(4, 10, 28, 0.85);
        border: 1px solid var(--cyan);
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 0 10px rgba(111, 227, 255, 0.3);
      }
      .video-unmute-btn:hover {
        background: var(--cyan);
        color: #020409;
      }

      #panel {
        position: fixed;
        font-family: "DisplayFont_MenuText";
        letter-spacing: 0.16em;
        left: 50%;
        top: 50%;
        z-index: 50;
        width: min(620px, calc(100vw - 32px));
        height: min(76vh, 720px);
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          165deg,
          rgba(10, 28, 58, 0.93),
          rgba(4, 10, 28, 0.96)
        );
        border: 1px solid rgba(120, 220, 255, 0.42);
        clip-path: polygon(
          0 20px,
          20px 0,
          100% 0,
          100% calc(100% - 20px),
          calc(100% - 20px) 100%,
          0 100%
        );
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.955);
        pointer-events: none;
        transition:
          opacity 0.22s ease,
          transform 0.26s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      #panel::before {
        content: "";
        position: absolute;
        inset: 7px;
        pointer-events: none;
        border: 1px solid rgba(120, 220, 255, 0.16);
        clip-path: polygon(
          0 16px,
          16px 0,
          100% 0,
          100% calc(100% - 16px),
          calc(100% - 16px) 100%,
          0 100%
        );
      }
      #panel.open {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
      }
      #p-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 18px;
        background: linear-gradient(
          90deg,
          rgba(70, 170, 255, 0.3),
          rgba(70, 170, 255, 0.04)
        );
        border-bottom: 1px solid rgba(120, 220, 255, 0.35);
      }
      #p-title {
        font-size: 24px;
        letter-spacing: 0.26em;
        color: #fff;
        text-shadow: 0 0 12px rgba(120, 220, 255, 0.8);
      }
      #p-code {
        margin-left: auto;
      }
      #p-close {
        font-family: "VT323", monospace;
        font-size: 15px;
        letter-spacing: 0.18em;
        color: var(--cyan);
        background: rgba(20, 60, 110, 0.6);
        border: 1px solid rgba(120, 220, 255, 0.5);
        padding: 4px 10px;
        cursor: pointer;
        transition: all 0.15s;
      }
      #p-close:hover {
        color: #fff;
        background: rgba(60, 140, 220, 0.7);
      }
      #p-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px 24px;
        font-size: 17px;
        line-height: 1.45;
        scrollbar-width: thin;
        scrollbar-color: #2b7ea8 transparent;
      }
      #p-body::-webkit-scrollbar {
        width: 8px;
      }
      #p-body::-webkit-scrollbar-thumb {
        background: linear-gradient(#2b7ea8, #6fe3ff);
        border: 2px solid #06122a;
      }
      #p-body::-webkit-scrollbar-track {
        background: rgba(10, 30, 60, 0.4);
      }
      #intro {
        color: #bfe9ff;
        min-height: 2.6em;
        margin-bottom: 12px;
      }
      #intro .cursor {
        animation: blink 1s steps(2) infinite;
        color: var(--cyan);
      }
      .row {
        display: flex;
        gap: 14px;
        padding: 7px 12px;
        margin: 2px 0;
        border-left: 2px solid transparent;
        opacity: 0;
        animation: rowin 0.35s ease forwards;
      }
      @keyframes rowin {
        to {
          opacity: 1;
        }
      }
      .row:hover {
        background: rgba(90, 200, 255, 0.1);
        border-left-color: var(--amber);
      }
      .row .k {
        color: #7fb8d8;
        letter-spacing: 0.1em;
        min-width: 132px;
      }
      .row .v {
        color: #eaf7ff;
        text-decoration: none;
      }
      .row.link {
        cursor: pointer;
      }
      .row.link .v::after {
        content: " ▸";
        color: var(--amber);
      }
      .row.link:hover .v {
        color: #fff;
        text-shadow: 0 0 8px rgba(160, 230, 255, 0.7);
      }
      .hd {
        font-size: 17px;
        letter-spacing: 0.3em;
        color: var(--amber);
        margin: 16px 0 8px;
        padding-bottom: 4px;
        border-bottom: 1px dashed rgba(255, 180, 94, 0.35);
        opacity: 0;
        animation: rowin 0.35s ease forwards;
      }
      .para {
        color: #9fcbe8;
        font-size: 15px;
        margin: 10px 4px;
        opacity: 0;
        animation: rowin 0.35s ease forwards;
      }
      .bar-row {
        display: block;
      }
      .bar-row .lbl {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        letter-spacing: 0.1em;
      }
      .bar-row .lbl span:last-child {
        color: var(--amber);
      }
      .bar {
        position: relative;
        height: 10px;
        background: rgba(18, 46, 88, 0.7);
        border: 1px solid rgba(120, 220, 255, 0.35);
        overflow: hidden;
      }
      .bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0;
        background: linear-gradient(90deg, #2f9dd8, #8ff0ff);
        box-shadow: 0 0 10px rgba(110, 227, 255, 0.8);
        transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          60deg,
          transparent 0 6px,
          rgba(2, 12, 28, 0.4) 6px 8px
        );
      }
      .entry {
        display: block;
      }
      .entry .t {
        font-size: 20px;
        letter-spacing: 0.16em;
        color: #fff;
      }
      .entry .m {
        font-size: 14px;
        color: var(--amber);
        letter-spacing: 0.2em;
        margin: 2px 0 4px;
      }
      .entry .d {
        color: #bfe0f2;
        font-size: 16px;
      }
      .tag {
        display: inline-block;
        border: 1px solid rgba(120, 220, 255, 0.4);
        padding: 0 8px;
        margin: 6px 6px 0 0;
        font-size: 14px;
        letter-spacing: 0.14em;
        color: var(--cyan2);
      }

      #err {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: none;
        align-items: center;
        justify-content: center;
        background: #020409;
        color: var(--cyan);
        font-size: 17px;
        letter-spacing: 0.12em;
        text-align: center;
        padding: 40px;
        line-height: 2;
        cursor: pointer;
      }

      @media (max-width: 760px) {
        #hud-tr,
        #hud-bl {
          display: none;
        }
        #sect {
          bottom: 80px;
        }
        #sect .name {
          font-size: 28px;
        }

        .btn {
          padding: 7px 12px 7px 15px;
          font-size: 14px;
          letter-spacing: 0.14em;
        }
        #panel {
          width: calc(100vw - 16px);
          height: min(72vh, 640px);
        }
        #p-title {
          font-size: 18px;
          letter-spacing: 0.16em;
        }
        #tip {
          bottom: 24%;
        }
        #tip .t1 {
          font-size: 16px;
          letter-spacing: 0.24em;
        }
        #tip .t2 {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud" id="hud-tl">
      <!-- OP: <span id="opname">—</span>  -->
      SYS <span class="dot">●</span> ONLINE
    </div>
    <div class="hud" id="hud-tr">
      <span id="clock">--:--:--</span><br />
    </div>
    <!-- <div class="hud" id="hud-bl">
      CORE TEMP <span id="rt">—</span> MK<br />PLASMA DENS
      <span id="rd">—</span> m⁻³<br />SOLENID FIELD <span id="rf">—</span> T
    </div> -->
    <div class="hud" id="hud-br">
      <span id="musbtn">MUSIC:ON</span> ·
      <span id="sndbtn">SND:ON</span><br />
      <!-- <span id="trackname">TRACK: —</span> -->
    </div>

    <div id="sect">
      <!-- <div class="code" id="sect-code">FILE-01</div> -->
      <div class="name" id="sect-name">OPERATOR</div>
      <div class="hint">DRAG TO SPIN ◈ CLICK NODE TO OPEN</div>
    </div>

    <div id="tip">
      <div class="t1">▸ DRAG TO SPIN THE COLUMN ◂</div>
      <div class="t2">CLICK A NODE TO OPEN ITS MENU</div>
    </div>

    <div id="panel">
      <div id="p-head">
        <span id="p-title"></span><span id="p-code"></span
        ><button id="p-close">✕ CLOSE</button>
      </div>
      <div id="p-body"></div>
    </div>

    <div id="err">SYSTEM FAULT</div>

    <script type="importmap">
      {"imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" }}
    </script>

    <script type="module">
      "use strict";
      const OPERATOR = { name: "", id: "" };
      const MUSIC_FILE   = "assets/audio/music.mp3";
      const MUSIC_VOLUME = 0.2;
      const REACT = {
        particleSpeed: 7.0, // highs → particle rise speed
        trunkPulse: 6.0, // transients → trunk light wave speed
        capGlow: 3.5, // transients → beam brightness flash
        reticlePulse: 3.0, // highs → reticle wobble
        orbitSpeed: 5.0, // overall → arc spin speed
        nodeFlash: 2.5, // transients → node opacity flash
        bloom: 0.7, // transients → bloom strength boost (new)
        particleGlow: 2.0, // transients → particle brightness boost (new)
      };

      const SECTIONS = [
        { id: "about",     name: "ABOUT",      icon: "person" },
        { id: "contact",   name: "CONTACT",    icon: "signal" },
        //{ id: "project02", name: "PROJECT 02", icon: "target" },
        { id: "project01", name: "PROJECT 01", icon: "target" }, ];

      const DATA = {
        about: {
          title: "ABOUT",
          rows: [
            { t: "hd", v: "About" },
            { t: "pa", v: 'Aspiring Game Developer & Graphics Programmer' },
            { t: "hd", v: "Skills" },
            { t: "kv", k: "LANG",  v: "C++ · C# · Python · HLSL · GLSL · OpenGL · HTML/CSS" },
            { t: "kv", k: "TOOLS", v: "Unreal Engin · Unity Engine · Blender"               },
            { t: "kv", k: "OTHER", v: "Git · ImGui · GLFW"                                  }, 
            { t: "kv", k: "PERSONAL SITE", v: "CLICK HERE.", href: "personal.html"          }, ], },
        project01: {
          title: "PROJECT 01",
          rows: [
            {
              t: "en",
              title: "BOAT GAME",
              meta: "2025",
              desc: `Y2K Inspired Boat Racing Game Concept.
                      A time-trial racing game where your fasted time per level is recorded on the leaderboards. Pass through checkpoints over multiple laps. 
                      Your fasted time for each level would be recorded in a leaderboard. The boat controls are precise and physically accurate.
                      <br><br>
                      The course design is inspired by Venice, and mingles with Y2K aesthetics.The music is one of the most important factors for this 
                      game concept and features heavily, heavily affecting visuals.
                      <br><br>
                      Racing games are generally car-centric and the idea to use boats instead allows for more of an identity for the game. 
                      With music being a big part of the identity, it is built into the game. The pitch of each song is tied to the players speed. 
                      There are also pickups in the form of letters, a nod to gondeliers who carried freight cargo down the canals. 
                      Picking up letters increases boat top speed, but are placed away checkpoints, creating a decision for the player.`,
              tags: ["Unity"],
            }, {
              type: "video",
              title: "",
              src: "assets/video/BOATGAME.mp4",
              muted: false, 
              loop: false,
              autoplay: false
            }, ], },
        // project02: {
        //   title: "SMALLER PROJECTS",
        //   rows: [
        //     {
        //       t: "en",
        //       title: "SPACE GAME",
        //       meta: "2026",
        //       desc: "Space Game Concept. ",
        //       tags: ["Unreal 5"],
        //     }, {
        //       type: "video",
        //       title: "",
        //       src: "assets/video/SBHGAME.mp4",
        //       muted: false, 
        //       loop: false,
        //       autoplay: false
        //     }, ], },
        contact: {
          title: "CONTACT",
          rows: [
            { t: "kv", k: "EMAIL",  v: "mitjohno@gmail.com", href: "mailto:mitjohno@gmail.com"  },
            { t: "kv", k: "GITHUB", v: "GitHub",             href: "https://github.com/0vva0va" }, ], },
      };

      const $ = (id) => document.getElementById(id);
      function showErr(msg) {
        const e = $("err");
        e.innerHTML     = (msg || "SYSTEM FAULT") + "<br>▸ CLICK TO REBOOT ◂";
        e.style.display = "flex";
        e.onclick       = () => location.reload();
      }

      let THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
      try {
        THREE = await import("three");
        ({ EffectComposer }  = await import("three/addons/postprocessing/EffectComposer.js"));
        ({ RenderPass }      = await import("three/addons/postprocessing/RenderPass.js"));
        ({ UnrealBloomPass } = await import("three/addons/postprocessing/UnrealBloomPass.js"));
        ({ OutputPass }      = await import("three/addons/postprocessing/OutputPass.js"));
      } 
      catch (e) {
        showErr("WEBGL / THREE.JS FAILED TO LOAD<br>AN INTERNET CONNECTION IS REQUIRED FOR THE 3D CORE (CDN)",);
        throw e;
      }

      try {
        main();
      } 
      catch (e) {
        showErr("RENDER CORE FAULT");
        throw e;
      }

      function main() {
        const N = SECTIONS.length,
          DELTA = (Math.PI * 2) / N;
        const trunkR = 110,
              trunkH = 520;
        const iconRingR = 150,
               nodeSize = 88,
                HEX_OFF = (nodeSize * 32) / 256;

        const TARGET_LINES = 480;
        let w = innerWidth,
            h = innerHeight,
            S = 1,
           IW = 640,
           IH = 480;
        function calcInternal() {
          S  = Math.max(1, Math.round(h / TARGET_LINES));
          IW = Math.max(160, Math.round(w / S));
          IH = Math.max(120, Math.round(h / S));
        }
        calcInternal();

        const BLOOM = { strength: 0.18, radius: 0.4, threshold: 0.45 };
        const DRAG_TURNS_PER_FULLSWIPE = 0.8;
        const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

        function glowTexture() {
          const c  = document.createElement("canvas");

        function drawGlyph(g, type, s) {
          g.lineWidth = Math.max(1.2, s * 0.16);
          g.lineCap = "round";
          g.lineJoin = "round";
          g.beginPath();
          if (type === "person") {
            g.arc(0, -s * 0.42, s * 0.3, 0, 7);
            g.stroke();
            g.beginPath();
            g.arc(0, s * 0.75, s * 0.62, Math.PI * 1.15, Math.PI * 1.85);
            g.stroke();
          } 
          else if (type === "target") {
            g.arc(0, 0, s * 0.55, 0, 7);
            g.stroke();
            g.beginPath();
            g.moveTo(0, -s * 0.95);
            g.lineTo(0, -s * 0.62);
            g.moveTo(0, s * 0.95);
            g.lineTo(0, s * 0.62);
            g.moveTo(-s * 0.95, 0);
            g.lineTo(-s * 0.62, 0);
            g.moveTo(s * 0.95, 0);
            g.lineTo(s * 0.62, 0);
            g.stroke();
            g.beginPath();
            g.arc(0, 0, s * 0.12, 0, 7);
            g.fill();
          } 
          else if (type === "chevron") {
            for (let k = 0; k < 3; k++) {
              const y = -s * 0.45 + k * s * 0.45;
              g.moveTo(-s * 0.55, y + s * 0.3);
              g.lineTo(0, y - s * 0.15);
              g.lineTo(s * 0.55, y + s * 0.3);
            }
            g.stroke();
          } 
          else if (type === "doc") {
            g.rect(-s * 0.42, -s * 0.55, s * 0.84, s * 1.1);
            g.stroke();
            g.beginPath();
            for (let k = 0; k < 3; k++) {
              const y = -s * 0.25 + k * s * 0.25;
              g.moveTo(-s * 0.24, y);
              g.lineTo(s * 0.24, y);
            }
            g.stroke();
          } 
          else if (type === "signal") {
            g.arc(0, s * 0.5, s * 0.1, 0, 7);
            g.fill();
            g.beginPath();
            for (const r of [0.35, 0.62, 0.88])
              g.arc(0, s * 0.5, s * r, -Math.PI * 0.82, -Math.PI * 0.18);
            g.stroke();
          } 
          else if (type === "link") {
            g.arc(-s * 0.28, 0, s * 0.34, 0, 7);
            g.stroke();
            g.beginPath();
            g.arc(s * 0.28, 0, s * 0.34, 0, 7);
            g.stroke();
          }
        }

        function hexPathOn(g, x, y, r) {
          g.beginPath();
          for (let k = 0; k < 6; k++) {
            const a  = (k * Math.PI) / 3 + Math.PI / 6;
            const px = x + Math.cos(a) * r,
                  py = y + Math.sin(a) * r;
            k ? g.lineTo(px, py) : g.moveTo(px, py);
          }
          g.closePath();
        }

        function makeNodeTexture(sec) {
          const c  = document.createElement("canvas");
          c.width  = c.height = 256;
          const g  = c.getContext("2d");
          const cx = 128,
                cy = 96,
                hr = 84;
          g.shadowColor = "rgba(120,220,255,.95)";
          g.shadowBlur = 15;
          hexPathOn(g, cx, cy, hr);
          g.fillStyle = "rgba(6,18,42,.85)";
          g.fill();
          g.strokeStyle = "rgba(150,230,255,.95)";
          g.lineWidth = 3;
          g.stroke();
          g.shadowBlur = 0;
          hexPathOn(g, cx, cy, hr - 8);
          g.strokeStyle = "rgba(120,220,255,.28)";
          g.lineWidth = 1.5;
          g.stroke();
          g.save();
          g.translate(cx, cy);
          g.strokeStyle = g.fillStyle = "rgba(235,250,255,.96)";
          g.shadowColor = "rgba(140,225,255,.9)";
          g.shadowBlur = 10;
          drawGlyph(g, sec.icon, hr * 0.42);
          g.restore();
          g.font = "34px VT323, monospace";
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.shadowColor = "rgba(120,220,255,.8)";
          g.shadowBlur = 12;
          g.fillStyle = "rgba(200,240,255,.95)";
          g.font = '28px DisplayFont_LandingHeadings, monospace';
          g.fillText(sec.name, 128, 226);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          return tex;
        }

        function makeReticleTexture() {
          const c = document.createElement("canvas");
          c.width = c.height = 256;
          const g = c.getContext("2d");
          g.strokeStyle = "rgba(255,190,110,1)";
          g.shadowColor = "rgba(255,180,94,.9)";
          g.shadowBlur  = 12;
          g.lineWidth   = 4;
          g.setLineDash([18, 14]);
          g.beginPath();
          g.arc(128, 128, 96, 0, 7);
          g.stroke();
          g.setLineDash([]);
          for (let k = 0; k < 4; k++) {
            const a = (k * Math.PI) / 2 + Math.PI / 4;
            g.beginPath();
            g.moveTo(128 + Math.cos(a) * 106, 128 + Math.sin(a) * 106);
            g.lineTo(128 + Math.cos(a) * 122, 128 + Math.sin(a) * 122);
            g.stroke();
          }
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          return tex;
        }

        const trunkGroup = new THREE.Group();

        const trunkMat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uPulse: { value: 0 },
            uDim: { value: 1 },
          },
          vertexShader: `
            varying vec2 vUv; varying vec3 vN; varying vec3 vV;
            void main(){
              vUv=uv;
              vN=normalize(normalMatrix*normal);
              vec4 mv=modelViewMatrix*vec4(position,1.0);
              vV=-mv.xyz;
              gl_Position=projectionMatrix*mv;
            }`,
          fragmentShader: `
            uniform float uTime; uniform float uPulse; uniform float uDim;
            varying vec2 vUv; varying vec3 vN; varying vec3 vV;
            float line(float x){ float d=abs(fract(x)-0.5); return smoothstep(0.38,0.5,d); }
            void main(){
              vec3 nv=normalize(vN), vv=normalize(vV);
              float lit=0.45+0.55*clamp(dot(nv,vv),0.,1.);
              float seams=line(vUv.x*18.0);
              float bands=line(vUv.y*28.0);
              float ribs =line(vUv.y*6.0);
              float pulse=0.65+0.35*sin(vUv.y*12.566 - uPulse);
              float fres =pow(1.0-abs(dot(nv,vv)),1.6);
              float menuBand=exp(-pow((vUv.y-0.5)*11.0,2.0));
              vec3 base=vec3(0.023,0.05,0.10)*(0.7+0.3*vUv.y);
              vec3 cyan=vec3(0.35,0.80,1.0);
              vec3 amber=vec3(1.0,0.62,0.28);
              vec3 glow= cyan*((seams*0.5+bands*0.32)*pulse+ribs*0.85)
                       + amber*menuBand*0.45
                       + cyan*fres*0.25;
              gl_FragColor=vec4((base+glow*uDim)*lit,1.0);
            }`,

        function arcRing(radius, y, speed, tilt) {

            );
            arc.rotation.z = (k * Math.PI * 2) / 3;
            grp.add(arc);

          grp.rotation.x = Math.PI / 2 + tilt;
          grp.position.y = y;
          grp.userData.speed = speed;
          scene.add(grp);
          return grp;

        const orbit1 = arcRing(172, 168, 0.28, 0.1);

        const NP = 420;

        const aA = new Float32Array(NP),

          aSp = new Float32Array(NP),

          aW = new Float32Array(NP);
        for (let i = 0; i < NP; i++) {
          aA[i] = Math.random() * Math.PI * 2;
          aR[i] = trunkR + 8 + Math.random() * 70;

          aSp[i] = 22 + Math.random() * 52;

        pGeo.setAttribute("aA", new THREE.BufferAttribute(aA, 1));
        pGeo.setAttribute("aR", new THREE.BufferAttribute(aR, 1));
        pGeo.setAttribute("aY", new THREE.BufferAttribute(aY, 1));
        pGeo.setAttribute("aSp", new THREE.BufferAttribute(aSp, 1));
        pGeo.setAttribute("aSz", new THREE.BufferAttribute(aSz, 1));
        pGeo.setAttribute("aW", new THREE.BufferAttribute(aW, 1));

        const pMat = new THREE.ShaderMaterial({
          uniforms: {
            uTime:  { value: 0 },
            uFlow:  { value: 0 },
            uPx:    { value: 1 },
            uDim:   { value: 1 },
            uBoost: { value: 1 },

          vertexShader: `
            attribute float aA; attribute float aR; attribute float aY;
            attribute float aSp; attribute float aSz; attribute float aW;
            uniform float uTime; uniform float uFlow; uniform float uPx;
            varying float vW; varying float vA;
            void main(){
              float y=mod(aY + uFlow*aSp, 640.0) - 320.0;
              float ang=aA + uTime*(0.15 + 0.12*aW);
              vec3 p=vec3(cos(ang)*aR, y, sin(ang)*aR);
              vec4 mv=modelViewMatrix*vec4(p,1.0);
              gl_PointSize=aSz*uPx/max(1.0,-mv.z);
              vW=aW;
              vA=smoothstep(-320.0,-230.0,y)*smoothstep(320.0,230.0,y);
              gl_Position=projectionMatrix*mv;
            }`,
          fragmentShader: `
            varying float vW; varying float vA;
            uniform float uDim; uniform float uBoost;
            void main(){
              float d=length(gl_PointCoord-0.5);
              float a=smoothstep(0.5,0.06,d)*vA*uDim;
              vec3 col=mix(vec3(0.35,0.8,1.0),vec3(1.0,0.62,0.3),vW);
              gl_FragColor=vec4(col*a*uBoost, a*uBoost);

          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });

            tp[k * 6 + 2] = Math.sin(a) * 560;

            sp[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);

          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.BufferAttribute(sp, 3));
          scene.add(
            new THREE.Points(
              g,
              new THREE.PointsMaterial({
                size: 6,
                map: texGlow,
                color: 0x9fd4ff,
                transparent: true,
                opacity: 0.6,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
              }),
            ),
          );
        })();

        let AC   = null,
        master   = null,
        sfxBus   = null,
        humBus   = null,
        analyser = null,
        freqData = null;

        let audioFailed = false,
                musicOn = true,
                  sfxOn = true,
                  humOn = false,
             musicWired = false;

        const bgm   = new Audio(MUSIC_FILE);
        bgm.loop    = true;
        bgm.volume  = MUSIC_VOLUME;
        bgm.preload = "auto";

        const elMus = $("musbtn");

        function setupAudio() {
          if (AC || audioFailed) return;
          try {
            AC = new (window.AudioContext || window.webkitAudioContext)();
            master = AC.createGain();
            master.gain.value = 0.9;
            master.connect(AC.destination);
            sfxBus = AC.createGain();
            sfxBus.gain.value = sfxOn ? 1 : 0;
            sfxBus.connect(master);
            humBus = AC.createGain();
            humBus.gain.value = musicOn ? 0.5 : 0;
            humBus.connect(master);
            analyser = AC.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.1;
            freqData = new Uint8Array(analyser.frequencyBinCount);
            startHum();
          } catch (e) {
            audioFailed = true;
          }
        }

        function wireMusic() {
          if (!AC || musicWired) return;
          if (AC.state !== "running") return;
          try {
            const src = AC.createMediaElementSource(bgm);
            src.connect(analyser);
            analyser.connect(master);
            musicWired = true;
          } catch (e) {}
        }

        function ensureMusic() {
          setupAudio();
          if (!musicOn) return;
          if (AC && AC.state === "suspended") {
            AC.resume()
              .then(() => {
                wireMusic();
                bgm.play().catch(() => {});
              })
              .catch(() => {});
          } else {
            wireMusic();
            bgm.play().catch(() => {});
          }
        }

        function startHum() {
          if (humOn || !AC || !humBus) return;
          humOn = true;
          try {
            const g = AC.createGain();
            g.gain.value = 0.08;
            const lp = AC.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 200;
            lp.Q.value = 0.5;
            const o1 = AC.createOscillator();
            o1.type = "sawtooth";
            o1.frequency.value = 46;
            const o2 = AC.createOscillator();
            o2.type = "sine";
            o2.frequency.value = 92.5;
            const g2 = AC.createGain();
            g2.gain.value = 0.4;
            o1.connect(lp);
            o2.connect(g2);
            g2.connect(lp);
            lp.connect(g);
            g.connect(humBus);
            const lfo = AC.createOscillator();
            lfo.frequency.value = 0.09;
            const lg = AC.createGain();
            lg.gain.value = 0.015;
            lfo.connect(lg);
            lg.connect(g.gain);
            o1.start();
            o2.start();
            lfo.start();
          } catch (e) {}
        }

        ensureMusic();

        addEventListener("pointerdown", ensureMusic);

        function tone(f0, f1, dur, type, vol, delay = 0) {
          if (!sfxOn || !AC || !sfxBus) return;
          try {
            const t0 = AC.currentTime + delay,
              o = AC.createOscillator(),
              g = AC.createGain();
            o.type = type;
            o.frequency.setValueAtTime(f0, t0);
            if (f1)
              o.frequency.exponentialRampToValueAtTime(
                Math.max(f1, 1),
                t0 + dur,
              );
            g.gain.setValueAtTime(0, t0);
            g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            o.connect(g);
            g.connect(sfxBus);
            o.start(t0);
            o.stop(t0 + dur + 0.03);
          } catch (e) {}
        }
        const sBlip = () => tone(1150, 900, 0.05, "square", 0.22);
        const sTick = () => tone(1500, 1400, 0.02, "square", 0.05);
        const sMove = () => {
          tone(300, 140, 0.25, "sawtooth", 0.16);
          tone(620, 300, 0.2, "triangle", 0.09, 0.02);
        };
        const sOpen = () => {
          tone(523, 1046, 0.12, "square", 0.18);
          tone(784, 1568, 0.14, "square", 0.14, 0.07);
        };
        const sClose = () => tone(880, 290, 0.16, "square", 0.16);
        const sRatchet = () => tone(700, 520, 0.04, "square", 0.12);

        $("musbtn").addEventListener("click", () => {
          musicOn = !musicOn;
          elMus.textContent = musicOn ? "MUSIC:ON" : "MUSIC:OFF";

        $("sndbtn").addEventListener("click", () => {

        function lsGet(k) {

        let tipActive = false,

        let rotA = -Math.PI / 2,

        let mouseX = 0,

        const tmpV = new THREE.Vector3(),

        const iconScr = Array.from({ length: N }, () => ({

        }));
        let iconCount = 0;
        let pf = (IH * 0.5) / Math.tan(THREE.MathUtils.degToRad(FOV * 0.5));

        let pulseT = 0,
          flowT = 0;

        const bands = { high: 0, all: 0, hit: 0, avgAll: 0 };
        function sampleBands() {
          if (!analyser || !freqData || !musicOn || bgm.paused || !musicWired) {
            bands.high = bands.all = bands.hit = 0;
            return;
          }
          try {
            analyser.getByteFrequencyData(freqData);
          } catch (e) {
            return;
          }
          const n = freqData.length;

          let h = 0;
          for (let i = 48; i < n; i++) h += freqData[i];
          h /= (n - 48) * 255;

          let a = 0;
          for (let i = 0; i < n; i++) a += freqData[i];
          a /= n * 255;

          bands.avgAll += (a - bands.avgAll) * 0.02;
          const spike = Math.max(0, a - bands.avgAll);
          bands.hit = Math.min(1, spike * 4.0);

          const upH = 0.9,
            dnH = 0.3;
          const upA = 0.8,
            dnA = 0.25;
          bands.high += (h - bands.high) * (h > bands.high ? upH : dnH);
          bands.all += (a - bands.all) * (a > bands.all ? upA : dnA);
        }

        function activeFromRot() {
          return ((Math.round((rotA + Math.PI / 2) / DELTA) % N) + N) % N;
        }
        function rotateTo(i, durOverride) {
          if (isOpen || !introDone) return;
          dismissTip(true);
          const base = i * DELTA - Math.PI / 2;
          const target =
            base + Math.PI * 2 * Math.round((rotA - base) / (Math.PI * 2));
          const d =
            durOverride !== undefined
              ? durOverride
              : Math.min(1200, 620 + Math.abs(target - rotA) * 60);
          tw = {
            a0: rotA,
            a1: target,
            t0: performance.now(),
            dur: Math.max(180, d),
          };
          sMove();
        }
        function onActive() {

          const el = $("sect-name");

          el.classList.remove("flash");
          void el.offsetWidth;
          el.classList.add("flash");
        }

        function easeInOutCubic(k) {
          return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        }
        function finishIntro() {
          if (introDone) return;
          introDone = true;
          document.body.classList.add("intro-done");
          maybeShowTip();
        }

        const panel = $("panel"),
          pBody = $("p-body");
        let typer = null;
        function startType(el, text, done) {
          stopType();
          let i = 0;
          el.textContent = "";
          typer = {
            el,
            text,
            done,
            iv: setInterval(() => {
              i++;
              el.textContent = text.slice(0, i);
              if (i % 3 === 0) sTick();
              if (i >= text.length) {
                const d = typer.done;
                stopType();
                d && d();
              }
            }, 13),
          };
        }
        function stopType() {
          if (typer) {
            clearInterval(typer.iv);
            typer = null;
          }
        }
        function skipType() {
          if (!typer) return;
          const { el, text, done } = typer;
          stopType();
          el.textContent = text;
          done && done();
        }
        
        // ── SITE AUDIO DUCKING FOR VIDEO ───────────────────────────────
        let videoDuckedAudio = false;

        function duckSiteAudio() {
          videoDuckedAudio = true;
          if (musicOn && !bgm.paused) {
            bgm.pause();
            bgm.dataset.wasPlaying = "true";
          }
          if (sfxOn && sfxBus) {
            sfxBus.gain.value = 0;
          }
          if (humOn && humBus && AC) {
            humBus.gain.setTargetAtTime(0, AC.currentTime, 0.25);
          }
        }

        function restoreSiteAudio() {
          if (!videoDuckedAudio) return;
          videoDuckedAudio = false;
          
          if (bgm.dataset.wasPlaying === "true") {
            bgm.play().catch(() => {});
            delete bgm.dataset.wasPlaying;
          }
          if (sfxOn && sfxBus) {
            sfxBus.gain.value = 1;
          }
          if (humOn && humBus && AC) {
            humBus.gain.setTargetAtTime(0.5, AC.currentTime, 0.25);
          }
        }

        function makeRow(r) {
          const el = document.createElement("div");
          if (r.t === "kv") {
            el.className = "row" + (r.href ? " link" : "");
            const k = document.createElement("span");
            k.className = "k";
            k.textContent = r.k;
            const v = document.createElement(r.href ? "a" : "span");
            v.className = "v";
            v.textContent = r.v;
            if (r.href) {
              v.href = r.href;
              if (/^http/.test(r.href)) {
                v.target = "_blank";
                v.rel = "noopener";
              }
            }
            el.append(k, v);
          } else if (r.t === "hd") {
            el.className = "hd";
            el.textContent = "◈ " + r.v;
          } else if (r.t === "pa") {
            el.className = "para";
            el.textContent = r.v;
          } else if (r.t === "bar") {
            el.className = "row bar-row";
            el.innerHTML = `<div class="lbl"><span>${r.k}</span><span>${r.v}%</span></div><div class="bar"><i></i></div>`;
            requestAnimationFrame(() =>
              requestAnimationFrame(() => {
                el.querySelector("i").style.width = r.v + "%";
              }),
            );
          } 
          else if (r.t === "en") {
            el.className = "row entry";
            el.innerHTML =
              `<span class="t">${r.title}</span><div class="m">${r.meta}</div><div class="d">${r.desc}</div>` +
              (r.tags
                ? `<div>${r.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>`
                : "");
          }
          else if (r.type === "video") {
            el.className = "panel-video-wrap";

            if (r.title) {
              const title = document.createElement("div");
              title.className = "hd";
              title.textContent = "◈ " + r.title;
              el.appendChild(title);
            }

            const stage = document.createElement("div");
            stage.style.position = "relative";
            stage.style.lineHeight = "0";

            const video = document.createElement("video");
            video.className = "panel-video";
            video.src = r.src;
            video.controls = true;
            video.playsInline = true;
            if (r.poster) video.poster = r.poster;
            if (r.loop) video.loop = true;
            
            const hasSound = r.muted !== true;
            video.muted = true; 
            video.volume = 0.15;
            if (r.autoplay) video.autoplay = true;

            if (hasSound) {
              const unmuteBtn = document.createElement("button");
              unmuteBtn.className = "video-unmute-btn";
              unmuteBtn.textContent = "🔇 TAP FOR SOUND";
              
              unmuteBtn.addEventListener("click", () => {
                video.muted = false;
                video.play().catch(()=>{});
                unmuteBtn.style.display = "none";
                duckSiteAudio();
              });

              video.addEventListener("volumechange", () => {
                if (video.muted || video.volume === 0) {
                  restoreSiteAudio();
                  unmuteBtn.style.display = "flex";
                }
              });

              video.addEventListener("ended", () => {
                restoreSiteAudio();
                unmuteBtn.style.display = "flex";
              });
              
              stage.appendChild(unmuteBtn);
            }

            stage.appendChild(video);
            el.appendChild(stage);
          }
          el.addEventListener("mouseenter", sBlip);
          return el;
        }

        function openMenu(i) {
          dismissTip(true);
          const sec = SECTIONS[i],
            d = DATA[sec.id],
            seq = ++openSeq;
          isOpen = true;
          document.body.classList.add("menu-open");
          panel.classList.add("open");
          $("p-title").textContent = d.title;
          pBody.scrollTop = 0;
          pBody.innerHTML = "";
          
          sOpen();
          d.rows.forEach((r, k) =>
            setTimeout(() => {
              if (seq !== openSeq) return;
              pBody.appendChild(makeRow(r));
              if (k % 2 === 0) sTick();
            }, k * 95),
          );
        }
        function closeMenu() {
          if (!isOpen) return;
          isOpen = false;
          openSeq++;
          stopType();
          document.body.classList.remove("menu-open");
          panel.classList.remove("open");
          document.querySelectorAll(".panel-video").forEach(v => {
            v.pause();
          });
          restoreSiteAudio();
          sClose();
        }
        $("p-close").addEventListener("click", closeMenu);
        pBody.addEventListener("click", skipType);

        function pick(x, y) {
          let best = -1,
            bd = 1e9;
          for (let n = 0; n < iconCount; n++) {
            const it = iconScr[n];
            if (it.hidden) continue;
            const d = Math.hypot(x - it.x, y - it.y);
            if (d < it.r && d < bd) {
              bd = d;
              best = it.i;
            }
          }
          return best;
        }
        let dragging = false,
          dragMoved = 0,
          lastPX = 0,
          activePointer = null;
        cv.addEventListener("pointerdown", (e) => {
          if (!introDone || isOpen || e.button !== 0 || activePointer !== null)
            return;
          activePointer = e.pointerId;
          dragging = true;
          dragMoved = 0;
          lastPX = e.clientX;
          cv.setPointerCapture(e.pointerId);
          cv.classList.add("grabbing");
        });
        cv.addEventListener("pointermove", (e) => {
          if (dragging && e.pointerId === activePointer) {
            const dx = e.clientX - lastPX;
            lastPX = e.clientX;
            dragMoved += Math.abs(dx);
            if (dragMoved > 4) {
              tw = null;
              rotA += dx * ((Math.PI * 2 * DRAG_TURNS_PER_FULLSWIPE) / w);
              dismissTip(true);
            }
            return;
          }
          mouseX = e.clientX / w - 0.5;
          mouseY = e.clientY / h - 0.5;
          if (isOpen) {
            hoverIdx = -1;
            return;
          }
          const hit = pick(e.clientX, e.clientY);
          if (hit !== hoverIdx && hit >= 0) sBlip();
          hoverIdx = hit;
          cv.style.cursor = hit >= 0 ? "pointer" : "grab";
        });
        function endDrag(e) {
          if (!dragging || e.pointerId !== activePointer) return;
          dragging = false;
          activePointer = null;
          cv.classList.remove("grabbing");
          if (dragMoved <= 5) {
            const hit = pick(e.clientX, e.clientY);
            if (hit >= 0) {
              hit === activeIdx ? openMenu(hit) : rotateTo(hit);
            }
          } else {
            rotateTo(activeFromRot(), 280);
          }
          cv.style.cursor = "grab";
        }
        cv.addEventListener("pointerup", endDrag);
        cv.addEventListener("pointercancel", endDrag);

        let wheelLock = 0;
        addEventListener(
          "wheel",
          (e) => {
            if (isOpen || !introDone) return;
            const n = performance.now();
            if (n - wheelLock < 200 || Math.abs(e.deltaY) < 12) return;
            wheelLock = n;
            rotateTo(activeIdx + (e.deltaY > 0 ? 1 : -1));
          },
          { passive: true },
        );
        function toggleFS() {
          if (!document.fullscreenElement)
            document.documentElement.requestFullscreen &&
              document.documentElement.requestFullscreen();
          else document.exitFullscreen && document.exitFullscreen();
        }

        document.addEventListener("keydown", (e) => {
          if (!introDone) return;
          if (e.key === "Escape") closeMenu();
          else if (e.key === "ArrowRight") rotateTo(activeIdx + 1);
          else if (e.key === "ArrowLeft") rotateTo(activeIdx - 1);
          else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            isOpen ? closeMenu() : openMenu(activeIdx);
          } else if (/^[1-6]$/.test(e.key)) {
            const i = +e.key - 1;
            i === activeIdx ? openMenu(i) : rotateTo(i);
          } else if (e.key === "f" || e.key === "F") toggleFS();
        });

        const elClock = $("clock"),
          elRt = $("rt"),
          elRd = $("rd"),
          elRf = $("rf");
        setInterval(() => {
          const d = new Date(),
            p = (n) => String(n).padStart(2, "0");
          elClock.textContent = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
          const deg = ((((rotA * 180) / Math.PI) % 360) + 360) % 360;
          elRot.textContent = deg.toFixed(1).padStart(5, "0");
          const t = time;
          elRt.textContent = (
            152.3 +
            Math.sin(t * 0.3) * 1.2 +
            Math.sin(t * 1.7) * 0.2
          ).toFixed(1);
          elRd.textContent =
            (
              1.02 +
              0.03 * Math.sin(t * 0.21) +
              0.004 * Math.sin(t * 1.3)
            ).toFixed(3) + "e20";
          elRf.textContent = (5.31 + 0.02 * Math.sin(t * 0.4 + 0.5)).toFixed(2);
        }, 250);
        onActive();

        addEventListener("resize", () => {
          w = innerWidth;
          h = innerHeight;
          calcInternal();
          camera.aspect = IW / IH;
          camera.updateProjectionMatrix();
          renderer.setSize(IW, IH, false);
          composer.setSize(IW, IH);
          pf = (IH * 0.5) / Math.tan(THREE.MathUtils.degToRad(FOV * 0.5));
        });

        pMat.uniforms.uPx.value = pf;
        if (REDUCED) {
          document.body.classList.add("intro-done");
          setTimeout(maybeShowTip, 400);
        }
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          time += dt;

          if (tw) {
            const k = (now - tw.t0) / tw.dur;
            if (k >= 1) {
              rotA = tw.a1;
              tw = null;
            } else {
              const e = 1 - Math.pow(1 - k, 3);
              rotA = tw.a0 + (tw.a1 - tw.a0) * e;
            }
          } else if (!dragging && introDone) {
            rotA =
              ((((rotA + Math.PI) % (Math.PI * 2)) + Math.PI * 2) %
                (Math.PI * 2)) -
              Math.PI;
          }
          const ai = activeFromRot();
          if (ai !== activeIdx) {
            activeIdx = ai;
            onActive();
            if (now - lastRatchet > 60) {
              lastRatchet = now;
              sRatchet();
            }
          }

          dim += ((isOpen ? 0.55 : 1) - dim) * Math.min(1, dt * 6);

          sampleBands();
          const high = bands.high,
            all = bands.all,
            hit = bands.hit;
          flowT += dt * (1 + high * REACT.particleSpeed);
          pulseT += dt * (1.1 + hit * REACT.trunkPulse);

          trunkMat.uniforms.uTime.value = time;
          trunkMat.uniforms.uPulse.value = pulseT;
          trunkMat.uniforms.uDim.value = dim;
          capMat.uniforms.uDim.value = dim;
          pMat.uniforms.uTime.value = time;
          pMat.uniforms.uFlow.value = flowT;
          pMat.uniforms.uDim.value = dim;
          // Particle brightness boost on transients — makes them punch through bloom
          pMat.uniforms.uBoost.value =
            1 + hit * REACT.particleGlow + high * 1.5;

          // Music-reactive bloom: strength spikes on transients so the boosted
          // particles (and everything bright) bloom harder on every hit
          bloomPass.strength = BLOOM.strength + hit * REACT.bloom + high * 0.4;

          beam1.material.opacity =
            dim * (0.26 + hit * REACT.capGlow + high * 0.3);
          beam2.material.opacity = dim * (0.42 + hit * 0.6 + high * 0.3);
          capGlowT.material.opacity = dim * (0.4 + hit * 1.2 + high * 0.4);
          capGlowB.material.opacity = dim * (0.3 + hit * 1.0 + high * 0.3);

          const orbMul = 1 + all * REACT.orbitSpeed;
          orbit1.rotation.y += dt * orbit1.userData.speed * orbMul;
          orbit2.rotation.y += dt * orbit2.userData.speed * orbMul;

          for (let i = 0; i < N; i++) {
            const phi = i * DELTA;
            const f = (Math.cos(phi - rotA - Math.PI / 2) + 1) / 2;
            const act = i === activeIdx;
            nodeSprites[i].position.y =
              Math.sin(time * 1.8 + i * 1.7) * 3 * SWAY;
            const target = nodeSize * (act ? 1.22 : 1);
            const s =
              nodeSprites[i].scale.x +
              (target - nodeSprites[i].scale.x) * Math.min(1, dt * 8);
            nodeSprites[i].scale.set(s, s, 1);
            nodeSprites[i].material.opacity = Math.min(
              1,
              dim * (0.4 + 0.6 * f) +
                (act ? 0.15 : 0) +
                (i === hoverIdx ? 0.15 : 0) +
                hit * REACT.nodeFlash * 0.2,
            );
          }
          if (!isOpen && introDone) {
            reticle.visible = true;
            reticle.material.rotation -= dt * 0.7;
            reticle.material.opacity = 0.95 * dim;
            const wobble =
              1 + 0.05 * Math.sin(time * 4) + high * REACT.reticlePulse * 0.15;
            reticle.scale.setScalar(nodeSize * 1.3 * wobble);
          } else reticle.visible = false;

          if (!introDone) {
            introT += dt;
            const k = Math.min(1, introT / INTRO_DUR);
            const e = easeInOutCubic(k);
            const arc = Math.pow(Math.sin(k * Math.PI), 2) * 46;
            camera.position.set(
              INTRO_POS.x + (CAM.x - INTRO_POS.x) * e + arc,
              INTRO_POS.y + (CAM.y - INTRO_POS.y) * e,
              INTRO_POS.z + (CAM.z - INTRO_POS.z) * e,
            );
            lookT.set(
              INTRO_LOOK.x + (0 - INTRO_LOOK.x) * e,
              INTRO_LOOK.y + (6 - INTRO_LOOK.y) * e,
              INTRO_LOOK.z + (0 - INTRO_LOOK.z) * e,
            );
            camera.lookAt(lookT);
            camZ = CAM.z;
            trunkGroup.rotation.y = rotA - 0.5 * (1 - e);
            if (k >= 1) {
              trunkGroup.rotation.y = rotA;
              finishIntro();
            }
          } else {
            trunkGroup.rotation.y = rotA;
            swayMix +=
              ((dragging || isOpen ? 0 : 1) - swayMix) * Math.min(1, dt * 4);
            const sw = SWAY * swayMix;
            camZ +=
              ((isOpen && w > 760 ? 760 : CAM.z) - camZ) * Math.min(1, dt * 5);
            camera.position.set(
              Math.sin(time * 0.22) * 4 * sw,
              CAM.y + Math.sin(time * 0.31) * 3 * sw,
              camZ,
            );
            lookT.set(-mouseX * 70 * swayMix, 6 - mouseY * 50 * swayMix, 0);
            camera.lookAt(lookT);
          }

          iconCount = 0;
          for (let i = 0; i < N; i++) {
            nodeSprites[i].getWorldPosition(tmpW);
            tmpV.copy(tmpW).project(camera);
            if (tmpV.z < 1) {
              const phi = i * DELTA;
              const f = (Math.cos(phi - rotA - Math.PI / 2) + 1) / 2;
              const it = iconScr[iconCount++];
              it.i = i;
              it.x = ((tmpV.x + 1) / 2) * w;
              it.y = ((1 - tmpV.y) / 2) * h;
              it.r =
                Math.max(
                  36,
                  (nodeSprites[i].scale.x * 0.8 * pf) /
                    camera.position.distanceTo(tmpW),
                ) *
                (h / IH);
              it.hidden = f < 0.22;
            }
          }

          composer.render();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        document.body.classList.add("on");
      }
    </script>
  </body>
</html>

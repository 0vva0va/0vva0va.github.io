<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Systems & interfaces — portfolio and writing." />
        <link rel="preconnect" href="https://unpkg.com" crossorigin />
        <title>Mitch J :: Developer</title>
        <style>
            /* ── Custom Fonts ──
               Drop your font files into a local `fonts/` folder (same
               level as this HTML file) and update the src paths below.
               Supported formats: .woff2 (preferred), .woff, .ttf, .otf.
               Add one @font-face block per weight/style you have. If you
               only have Regular, just delete the Bold block and rely on
               the browser's synthetic bold, or swap it for the same file
               to avoid faux-bold rendering. */
            @font-face {
                font-family: "CustomMono";
                src: url("fonts/DepartureMono-Regular.woff2") format("woff2");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: "CustomMono";
                src: url("fonts/DepartureMono-Regular.woff2") format("woff2");
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }

            :root {
                --bg: #000000;
                --text: #ffffff;
                --muted: #b8b8b8;
                --dim: #333333;
                --faint: #787878;

                /* Custom font first, falling back to the original
                   monospace stack if it fails to load. Change the first
                   name to match whatever `font-family` you used above. */
                --font: "CustomMono", "SFMono-Regular", Consolas,
                    "Liberation Mono", Menlo, Courier, monospace;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            ::selection {
                background: var(--faint);
                color: var(--bg);
            }

            html {
                scroll-behavior: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--dim) var(--bg);
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--font);
                font-size: 15px;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                overflow-x: hidden;
            }

            body.home-active {
                overflow: hidden;
            }

            /* The viewport scrollbar is painted on the documentElement
               (<html>), not <body> — even though body's overflow is what
               gets propagated to the viewport. Targeting body here is a
               no-op in Chrome/Safari/Edge, so we style html instead. */
            html::-webkit-scrollbar {
                width: 8px;
            }
            html::-webkit-scrollbar-track {
                background: var(--bg);
            }
            html::-webkit-scrollbar-thumb {
                background: var(--dim);
                border: 2px solid var(--bg);
                border-radius: 4px;
            }
            html::-webkit-scrollbar-thumb:hover {
                background: var(--faint);
            }

            a, button, [onclick], .back-link {
                cursor: pointer;
            }

            a:focus-visible,
            button:focus-visible,
            [onclick]:focus-visible {
                outline: 1px dashed var(--faint);
                outline-offset: 3px;
            }

            @media (prefers-reduced-motion: reduce) {
                .view {
                    animation: none;
                }
                .retro-btn,
                .game-item,
                .article-item,
                .writing-item,
                .back-link,
                .btn-arrow,
                #bg-dimmer {
                    transition: none !important;
                }
            }

            /* ── Grain Overlay ── */
            #grain-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
                pointer-events: none;
                opacity: 0.04;
            }

            /* ── Background Canvas ── */
            #bg-canvas-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -2;
                pointer-events: none;
            }
            #bg-canvas-container canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            /* ── Background Dimmer ── */
            #bg-dimmer {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                background: rgba(0, 0, 0, 0);
                transition: background 0.6s ease;
                pointer-events: none;
            }
            #bg-dimmer.dim {
                background: rgba(0, 0, 0, 0.65);
            }

            /* ── Background Audio Toggle ── */
            .audio-toggle {
                position: fixed;
                right: 20px;
                bottom: 20px;
                z-index: 50;
                background: rgba(0, 0, 0, 0.55);
                color: var(--muted);
                border: 1px solid var(--dim);
                border-radius: 20px;
                padding: 8px 14px;
                font-family: inherit;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: color 0.2s ease, border-color 0.2s ease,
                    opacity 0.3s ease;
            }
            .audio-toggle:hover {
                color: var(--text);
                border-color: var(--faint);
            }
            .audio-toggle.muted {
                color: var(--faint);
            }

            /* ── Main Layout ── */
            main {
                position: relative;
                z-index: 1;
                max-width: 800px;
                margin: 0 auto;
                padding: 32px 24px;
                min-height: 100vh;
            }

            .view {
                display: none;
                animation: fadeIn 0.25s ease;
            }
            .view.active {
                display: block;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* ── Integrated Landing Page ── */
            #home-view {
                min-height: calc(100vh - 64px);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            #home-view:not(.active) {
                display: none !important;
                pointer-events: none !important;
            }

            .home-hero {
                width: 100%;
                max-width: 440px;
                background: transparent;
                text-align: left;
            }
            .home-title {
                font-size: clamp(28px, 5.5vw, 40px);
                font-weight: 400;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                margin-bottom: 6px;
                color: var(--text);
            }
            .home-subtitle {
                font-size: 13px;
                color: var(--faint);
                letter-spacing: 0.1em;
                margin-bottom: 40px;
            }
            .home-nav {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }
            .retro-btn {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                background: transparent;
                color: var(--muted);
                border: none;
                border-bottom: 1px dashed var(--dim);
                font-family: inherit;
                font-size: 14px;
                letter-spacing: 0.12em;
                padding: 14px 4px;
                text-transform: uppercase;
                text-decoration: none;
                transition: all 0.2s ease;
            }
            .retro-btn:hover {
                color: var(--text);
                border-bottom-style: solid;
                border-bottom-color: var(--text);
                padding-left: 12px;
            }
            .retro-btn .btn-arrow {
                opacity: 0.4;
                transition: transform 0.2s ease, opacity 0.2s ease;
            }
            .retro-btn:hover .btn-arrow {
                opacity: 1;
                transform: translateX(4px);
            }

            /* ── Sub-view Top Header Links ── */
            .sub-top-bar {
                margin-bottom: 24px;
            }

            /* ── About ── */
            .about-section h2 {
                font-size: clamp(24px, 3.8vw, 34px);
                font-weight: 400;
                margin-bottom: 24px;
                letter-spacing: -0.02em;
            }
            .about-section p {
                color: var(--muted);
                max-width: 540px;
                margin-bottom: 1.2em;
                line-height: 1.65;
                font-size: 14px;
            }
            .about-section a {
                color: var(--text);
                text-decoration: none;
                border-bottom: 1px solid var(--faint);
                transition: border-color 0.2s ease;
            }
            .about-section a:hover {
                border-bottom-color: var(--text);
            }

            /* ── Entry List Rows (shared by games/articles/writing) ──
               Each row is a flex line: text on the left, an optional
               thumbnail (image or muted looping video) on the right. */
            .game-item,
            .article-item,
            .writing-item {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 16px;
            }
            .entry-main {
                flex: 1;
                min-width: 0;
            }

            /* ── Games List ── */
            .games-section h2 {
                font-size: clamp(24px, 3.8vw, 34px);
                font-weight: 400;
                margin-bottom: 20px;
                letter-spacing: -0.02em;
            }
            .games-list {
                list-style: none;
            }
            .game-item {
                border-bottom: 1px solid var(--dim);
                padding: 16px 0;
                transition: padding-left 0.2s ease;
            }
            .game-item:hover {
                padding-left: 8px;
            }
            .game-item a {
                color: var(--text);
                text-decoration: none;
                font-size: 15px;
                display: block;
                margin-bottom: 4px;
            }
            .game-item a:hover {
                text-decoration: underline;
            }
            .game-meta {
                color: var(--faint);
                font-size: 12px;
            }
            .game-excerpt {
                color: var(--muted);
                font-size: 13px;
                margin-top: 6px;
                max-width: 500px;
                line-height: 1.55;
            }

            /* ── Articles List ── */
            .articles-section h2 {
                font-size: clamp(24px, 3.8vw, 34px);
                font-weight: 400;
                margin-bottom: 20px;
                letter-spacing: -0.02em;
            }
            .articles-list {
                list-style: none;
            }
            .article-item {
                border-bottom: 1px solid var(--dim);
                padding: 16px 0;
                transition: padding-left 0.2s ease;
            }
            .article-item:hover {
                padding-left: 8px;
            }
            .article-item a {
                color: var(--text);
                text-decoration: none;
                font-size: 15px;
                display: block;
                margin-bottom: 4px;
            }
            .article-item a:hover {
                text-decoration: underline;
            }
            .article-meta {
                color: var(--faint);
                font-size: 12px;
            }
            .article-excerpt {
                color: var(--muted);
                font-size: 13px;
                margin-top: 6px;
                max-width: 500px;
                line-height: 1.55;
            }
            .entry-thumb {
                display: block;
                flex-shrink: 0;
                width: 96px;
                height: 96px;
                object-fit: cover;
                border: 1px solid var(--dim);
                background: var(--dim);
            }

            /* ── Paper Sheet Overlay Styles (Dynamic Size & Flat Slab Scrollbar) ── */
            .paper-sheet {
                background: #18181c;
                color: #dedad2;
                padding: 36px 36px 36px 40px;
                border-radius: 4px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow:
                    0 20px 40px rgba(0, 0, 0, 0.75),
                    0 4px 12px rgba(0, 0, 0, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.08);
                margin-top: 8px;
                
                /* Fits text naturally up to max height limit */
                height: auto;
                max-height: calc(100vh - 80px);
                overflow-y: auto;

                /* Firefox Thin Scrollbar */
                scrollbar-width: thin;
                scrollbar-color: #484856 #111114;
            }

            /* WebKit Custom Scrollbar (Hide arrows & flat slab thumb) */
            .paper-sheet::-webkit-scrollbar {
                width: 7px;
            }
            .paper-sheet::-webkit-scrollbar-button {
                display: none;
                height: 0;
                width: 0;
            }
            .paper-sheet::-webkit-scrollbar-track {
                background: #111114;
                border-radius: 0;
            }
            .paper-sheet::-webkit-scrollbar-thumb {
                background: #484856;
                border-radius: 0;
            }
            .paper-sheet::-webkit-scrollbar-thumb:hover {
                background: #6e6e80;
            }

            .paper-sheet h2 {
                color: #f5f2eb;
            }
            .paper-sheet .game-detail-year,
            .paper-sheet .article-detail-year,
            .paper-sheet .writing-detail-meta {
                color: #a5a199;
            }
            .paper-sheet .game-detail-line,
            .paper-sheet .article-detail-line,
            .paper-sheet .writing-detail-line {
                background: #2e2e36;
            }
            .paper-sheet .game-detail-desc,
            .paper-sheet .article-detail-desc,
            .paper-sheet .writing-detail-body {
                color: #dedad2;
            }
            .paper-sheet .game-detail-desc h3,
            .paper-sheet .article-detail-desc h3,
            .paper-sheet .writing-detail-body h3 {
                color: #f5f2eb;
                font-size: 16px;
                font-weight: 500;
                margin: 24px 0 10px 0;
            }
            .paper-sheet .game-detail-tech span,
            .paper-sheet .article-detail-tech span,
            .paper-sheet .writing-detail-tags span {
                border-color: #3b3b45;
                color: #b8b4ac;
                background: #222226;
            }
            .paper-sheet .game-detail-links a,
            .paper-sheet .article-detail-links a {
                color: #f5f2eb;
                border-bottom-color: #777782;
            }
            .paper-sheet .game-detail-links a:hover,
            .paper-sheet .article-detail-links a:hover {
                border-bottom-color: #f5f2eb;
            }
            .paper-sheet .back-link {
                color: #a5a199;
                margin-bottom: 16px;
            }
            .paper-sheet .back-link:hover {
                color: #f5f2eb;
            }

            /* ── Detail Standard Styling ── */
            .game-detail h2,
            .article-detail h2,
            .writing-detail h2 {
                font-size: clamp(26px, 4.5vw, 40px);
                font-weight: 400;
                line-height: 1.2;
                letter-spacing: -0.02em;
                margin-bottom: 6px;
            }
            .game-detail-year,
            .article-detail-year,
            .writing-detail-meta {
                font-size: 14px;
                margin-bottom: 20px;
            }
            .game-detail-line,
            .article-detail-line,
            .writing-detail-line {
                width: 100%;
                height: 1px;
                margin-bottom: 24px;
            }
            .game-detail-desc,
            .article-detail-desc,
            .writing-detail-body {
                max-width: 740px;
                line-height: 1.7;
                margin-bottom: 24px;
                font-size: 14px;
            }
            .writing-detail-body p {
                margin-bottom: 1.2em;
            }
            .game-detail-desc p,
            .article-detail-desc p,
            .writing-detail-body p {
                margin-bottom: 1.2em;
            }
            .game-detail-desc h3,
            .article-detail-desc h3,
            .writing-detail-body h3 {
                font-size: 16px;
                font-weight: 500;
                margin: 24px 0 10px 0;
            }
            .game-detail-desc ul,
            .game-detail-desc ol,
            .article-detail-desc ul,
            .article-detail-desc ol,
            .writing-detail-body ul,
            .writing-detail-body ol {
                margin: 0 0 1.2em 1.4em;
            }
            .game-detail-desc li,
            .article-detail-desc li,
            .writing-detail-body li {
                margin-bottom: 0.4em;
            }
            .game-detail-desc blockquote,
            .article-detail-desc blockquote,
            .writing-detail-body blockquote {
                border-left: 2px solid var(--dim);
                padding-left: 14px;
                margin: 0 0 1.2em 0;
                color: var(--faint);
            }
            .game-detail-desc code,
            .article-detail-desc code,
            .writing-detail-body code {
                font-family: inherit;
                background: var(--dim);
                padding: 2px 5px;
                font-size: 0.9em;
            }
            .game-detail-desc pre,
            .article-detail-desc pre,
            .writing-detail-body pre {
                background: var(--dim);
                padding: 12px 14px;
                overflow-x: auto;
                margin-bottom: 1.2em;
            }
            .game-detail-desc pre code,
            .article-detail-desc pre code,
            .writing-detail-body pre code {
                background: none;
                padding: 0;
            }
            .game-detail-desc img,
            .game-detail-desc video,
            .article-detail-desc img,
            .article-detail-desc video,
            .writing-detail-body img,
            .writing-detail-body video {
                max-width: 100%;
                height: auto;
                display: block;
                margin: 1.2em auto;
                border: 1px solid var(--dim);
            }
            .game-detail-desc figure,
            .article-detail-desc figure,
            .writing-detail-body figure {
                margin: 1.2em 0;
            }
            .game-detail-desc figcaption,
            .article-detail-desc figcaption,
            .writing-detail-body figcaption {
                font-size: 12px;
                color: var(--faint);
                margin-top: 6px;
            }
            .game-detail-desc a,
            .article-detail-desc a,
            .writing-detail-body a {
                color: inherit;
            }
            .game-detail-tech,
            .article-detail-tech,
            .writing-detail-tags {
                margin-bottom: 24px;
            }
            .game-detail-tech span,
            .article-detail-tech span,
            .writing-detail-tags span {
                display: inline-block;
                border: 1px solid var(--dim);
                padding: 4px 9px;
                margin-right: 6px;
                margin-bottom: 6px;
                font-size: 12px;
            }
            .game-detail-links a,
            .article-detail-links a {
                display: inline-block;
                text-decoration: none;
                padding-bottom: 2px;
                margin-right: 20px;
                font-size: 14px;
                transition: border-color 0.2s ease;
            }
            .back-link {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
                font-size: 13px;
                color: var(--muted);
                transition: color 0.2s ease;
            }
            .back-link:hover {
                color: var(--text);
            }

            /* ── Writing List ── */
            .writing-section h2 {
                font-size: clamp(24px, 3.8vw, 34px);
                font-weight: 400;
                margin-bottom: 20px;
                letter-spacing: -0.02em;
            }
            .writing-list {
                list-style: none;
            }
            .writing-item {
                border-bottom: 1px solid var(--dim);
                padding: 16px 0;
                transition: padding-left 0.2s ease;
            }
            .writing-item:hover {
                padding-left: 8px;
            }
            .writing-item a {
                color: var(--text);
                text-decoration: none;
                font-size: 15px;
                display: block;
                margin-bottom: 4px;
            }
            .writing-item a:hover {
                text-decoration: underline;
            }
            .writing-meta {
                color: var(--faint);
                font-size: 12px;
            }
            .writing-excerpt {
                color: var(--muted);
                font-size: 13px;
                margin-top: 6px;
                max-width: 500px;
                line-height: 1.55;
            }

            .hidden {
                display: none !important;
            }

            @media (max-width: 600px) {
                main {
                    padding: 20px 16px;
                }
                .paper-sheet {
                    padding: 24px 20px;
                    max-height: calc(100vh - 60px);
                }
                .entry-thumb {
                    width: 64px;
                    height: 64px;
                }
            }
        </style>
    </head>

            </p>

                    <ul class="articles-list" id="articles-list-ul"></ul>

                <div id="article-detail" class="article-detail paper-sheet hidden">
                    <a class="back-link" tabindex="0" role="button" onclick="showArticlesList()"
                        >← Articles</a

        <script type="importmap">

        <script type="module">
            import * as THREE from "three";
            import { marked } from "marked";
            marked.setOptions({ breaks: true });

            /* ── Markdown Video Support ──
               Markdown has no native video syntax, so entry bodies can
               embed a video the same way they embed an image:
                 ![Caption](media/clip.mp4)
               After marked renders the image tag, any <img> whose src ends
               in a common video extension is swapped for a <video controls
               playsinline> element. The alt text (if any) is kept as a
               fallback message for browsers that can't play the file. */
            const VIDEO_EXT_RE = /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i;

            /* ── Entry Thumbnails ──
               `thumbnail:` in an entry's frontmatter can point at either an
               image or a video file — video thumbnails autoplay muted and
               loop silently, like a GIF, with no controls. */
            function renderThumb(thumbnail) {
                if (!thumbnail) return "";
                if (VIDEO_EXT_RE.test(thumbnail)) {
                    return `<video class="entry-thumb" src="${thumbnail}" autoplay muted loop playsinline preload="metadata"></video>`;
                }
                return `<img class="entry-thumb" src="${thumbnail}" alt="" loading="lazy">`;
            }

            function renderMarkdown(raw) {
                let html = marked.parse(raw || "");
                html = html.replace(
                    /<img\s+([^>]*?)>/gi,
                    (fullMatch, attrs) => {
                        const srcMatch = attrs.match(/src="([^"]*)"/i);
                        if (!srcMatch || !VIDEO_EXT_RE.test(srcMatch[1]))
                            return fullMatch;
                        const altMatch = attrs.match(/alt="([^"]*)"/i);
                        const alt = altMatch ? altMatch[1] : "";
                        return `<video controls playsinline preload="metadata" src="${srcMatch[1]}">${alt || "Your browser does not support the video tag."}</video>`;
                    },
                );
                return html;
            }

            /* ── Background Audio (per-entry, fades in/out, loops, mutable) ──
               Entries can opt into a looping background track via an
               `audio:` frontmatter field (e.g. `audio: media/theme.mp3`).
               It fades in when a detail view with an audio track opens,
               loops for as long as that detail is open, fades out when the
               user navigates away, and can be muted via the floating
               toggle in the corner. */
            const AUDIO_FADE_MS = 1200;
            const AUDIO_TARGET_VOLUME = 0.55;

            const audioToggleBtn = document.getElementById("audio-toggle");
            const audioToggleLabel = document.getElementById(
                "audio-toggle-label",
            );

            let bgAudio = null;
            let bgAudioFadeRAF = null;

            function fadeAudioVolume(audio, from, to, duration, onDone) {
                if (bgAudioFadeRAF) cancelAnimationFrame(bgAudioFadeRAF);
                const start = performance.now();
                function step(now) {
                    const t = Math.min((now - start) / duration, 1);
                    audio.volume = from + (to - from) * t;
                    if (t < 1) {
                        bgAudioFadeRAF = requestAnimationFrame(step);
                    } else {
                        bgAudioFadeRAF = null;
                        if (onDone) onDone();
                    }
                }
                bgAudioFadeRAF = requestAnimationFrame(step);
            }

            function updateAudioToggleUI() {
                if (!bgAudio) return;
                audioToggleBtn.classList.toggle("muted", bgAudio.muted);
                audioToggleLabel.textContent = bgAudio.muted
                    ? "♪ muted"
                    : "♪ sound";
            }

            function playEntryAudio(src) {
                stopEntryAudio(true);
                const audio = new Audio(src);
                audio.loop = true;
                audio.volume = 0;
                bgAudio = audio;
                audio.play().catch(() => {
                    // Autoplay may be blocked until the user interacts with
                    // the page; the toggle button still reflects state and
                    // playback will begin once permitted.
                });
                fadeAudioVolume(audio, 0, AUDIO_TARGET_VOLUME, AUDIO_FADE_MS);
                audioToggleBtn.classList.remove("hidden");
                updateAudioToggleUI();
            }

            function stopEntryAudio(immediate) {
                if (!bgAudio) {
                    audioToggleBtn.classList.add("hidden");
                    return;
                }
                const audio = bgAudio;
                bgAudio = null;
                audioToggleBtn.classList.add("hidden");
                if (immediate) {
                    audio.pause();
                    return;
                }
                fadeAudioVolume(
                    audio,
                    audio.volume,
                    0,
                    AUDIO_FADE_MS,
                    () => audio.pause(),
                );
            }

            window.toggleAudioMute = function () {
                if (!bgAudio) return;
                bgAudio.muted = !bgAudio.muted;
                updateAudioToggleUI();
            };

            const bgDimmer = document.getElementById("bg-dimmer");

            /* ── Keyboard activation for link-styled buttons ── */
            document.addEventListener("keydown", (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;
                const target = e.target;
                if (target.matches('[role="button"]')) {
                    e.preventDefault();
                    target.click();
                }
            });

            const prefersReducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)",
            ).matches;

            /* ── Grain Overlay ── */
            const grainCanvas = document.getElementById("grain-overlay");
            const gCtx = grainCanvas.getContext("2d");

            // Static grain: rendered once at full device-pixel resolution
            // (and again on resize), never animated. Using devicePixelRatio
            // keeps each grain speck mapped to a physical pixel — finer and
            // crisper on high-DPI screens — with no per-frame cost since it
            // only ever renders on load/resize.
            const grainDPR = Math.min(window.devicePixelRatio || 1, 3);

            function resizeGrain() {
                grainCanvas.width = Math.round(window.innerWidth * grainDPR);
                grainCanvas.height = Math.round(window.innerHeight * grainDPR);
                renderGrainFrame();
            }

            function renderGrainFrame() {
                const w = grainCanvas.width;
                const h = grainCanvas.height;
                const imgData = gCtx.createImageData(w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const v = Math.random() * 255;
                    data[i] = v;
                    data[i + 1] = v;
                    data[i + 2] = v;
                    data[i + 3] = 255;
                }
                gCtx.putImageData(imgData, 0, 0);
            }

            resizeGrain();

            let grainResizeRAF = null;
            window.addEventListener("resize", () => {
                if (grainResizeRAF !== null) return;
                grainResizeRAF = requestAnimationFrame(() => {
                    grainResizeRAF = null;
                    resizeGrain();
                });
            });

            /* ── Audio Context Initializer ── */
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (
                        window.AudioContext || window.webkitAudioContext
                    )();
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
            }

            document.addEventListener("click", initAudio, { once: true });
            document.addEventListener("keydown", initAudio, { once: true });

            /* ── Dithered Background Shader ── */
            const container = document.getElementById("bg-canvas-container");
            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const geometry = new THREE.PlaneGeometry(2, 2);

            const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;

            const fragmentShader = `
      uniform float u_time;
      uniform vec2 u_resolution;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p *= 2.0;
          a *= 0.5;
        }
        return v;
      }

      float warp(vec2 p, float t) {
        vec2 q = vec2(
          fbm(p + vec2(0.0, 0.0) + t * 0.08),
          fbm(p + vec2(5.2, 1.3) + t * 0.06)
        );
        vec2 r = vec2(
          fbm(p + 3.0 * q + vec2(t * 0.05, t * 0.04)),
          fbm(p + 3.0 * q + vec2(1.7, 9.2) + t * 0.03)
        );
        return fbm(p + 2.0 * r);
      }

      float bayer4x4(vec2 coord) {
        int x = int(mod(coord.x, 4.0));
        int y = int(mod(coord.y, 4.0));
        int index = x + y * 4;
        if (index == 0) return 0.0;
        if (index == 1) return 0.5;
        if (index == 2) return 0.125;
        if (index == 3) return 0.625;
        if (index == 4) return 0.75;
        if (index == 5) return 0.25;
        if (index == 6) return 0.875;
        if (index == 7) return 0.375;
        if (index == 8) return 0.1875;
        if (index == 9) return 0.6875;
        if (index == 10) return 0.0625;
        if (index == 11) return 0.5625;
        if (index == 12) return 0.9375;
        if (index == 13) return 0.4375;
        if (index == 14) return 0.8125;
        if (index == 15) return 0.3125;
        return 0.0;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_resolution;
        float t = u_time;
        vec2 p = uv * 2.5;
        float water = warp(p, t);
        water += sin(uv.x * 6.0 + t * 0.4) * 0.04;
        water += sin(uv.y * 5.0 - t * 0.3) * 0.04;
        water += sin((uv.x + uv.y) * 4.0 + t * 0.2) * 0.03;
        water = smoothstep(0.25, 0.75, water);
        
        water = water * 0.4 + 0.1;
        
        float threshold = bayer4x4(gl_FragCoord.xy);
        float dithered = water + (threshold - 0.5) * 0.12;
        float levels = 5.0;
        float quantized = floor(dithered * (levels - 1.0) + 0.5) / (levels - 1.0);
        quantized = clamp(quantized, 0.0, 1.0);
        
        gl_FragColor = vec4(vec3(quantized * 0.55), 1.0);
      }
    `;

            const material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    u_time: { value: 0.0 },
                    u_resolution: {
                        value: new THREE.Vector2(
                            window.innerWidth,
                            window.innerHeight,
                        ),
                    },
                },
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const clock = new THREE.Clock();
            let sceneRAF = null;

            function animate() {
                sceneRAF = requestAnimationFrame(animate);
                material.uniforms.u_time.value = clock.getElapsedTime();
                renderer.render(scene, camera);
            }

            function startScene() {
                if (sceneRAF === null) {
                    clock.start();
                    animate();
                }
            }
            function stopScene() {
                if (sceneRAF !== null) {
                    cancelAnimationFrame(sceneRAF);
                    sceneRAF = null;
                    clock.stop();
                }
            }

            if (prefersReducedMotion) {
                // Render a single static frame — no continuous animation.
                renderer.render(scene, camera);
            } else {
                startScene();
                document.addEventListener("visibilitychange", () => {
                    if (document.hidden) stopScene();
                    else startScene();
                });
            }

            let resizeRAF = null;
            window.addEventListener("resize", () => {
                if (resizeRAF !== null) return;
                resizeRAF = requestAnimationFrame(() => {
                    resizeRAF = null;
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    material.uniforms.u_resolution.value.set(w, h);
                    renderer.setSize(w, h);
                    if (prefersReducedMotion) renderer.render(scene, camera);
                });
            });

            /* ── Game Data ──
               No hardcoded fallback entries — this section is driven

            /* ── Article Data ──
               No hardcoded fallback entries — this section is driven

               data/articles/index.json) and they'll load in automatically

            const defaultArticles = {};
            let articles = defaultArticles;

            const articlesList = document.getElementById("articles-list");

                    li.innerHTML = `

                });

            /* ── Writing Data ──
               Default/fallback data, used if data/writing.json can't be
               fetched. Edit that file to add/update posts without touching
               this script. */
            const defaultWritings = {
                "zero-dependencies": {
                    title: "Designing for Zero Dependencies",
                    meta: "2026 — 12 min read",
                    body: `Every dependency you add to a project is a liability. Not just in terms of security or maintenance burden, but in cognitive overhead. When you import a library, you are signing up to understand its API, its quirks, its upgrade path, and its transitive dependencies.

This essay explores the philosophy of building software with zero external dependencies. We look at real-world examples where stripping away libraries led to faster builds, smaller binaries, and more predictable behavior.

The key insight is that most of what we need is already there — in the standard library, in the operating system, or in the browser. The hard part is resisting the temptation to reach for a package manager.

### 1. The Supply Chain Trap

Modern software development has normalized pulling in thousands of third-party packages for trivial tasks. Micro-packages introduce attack vectors, audit headaches, and version drift. When you restrict your codebase to standard libraries, your build stays deterministic. You no longer spend hours fixing broken transitive dependencies after a clean install on CI/CD pipelines.

### 2. Performance & Binary Size

Third-party libraries are designed to be generic. They handle edge cases you will never encounter, carry legacy support you will never need, and drag along utility functions that bloat your bundle size. By writing domain-specific implementations tailored precisely to your application's data structures, you often achieve 10x memory savings and drastically reduced execution time.

### 3. Maintainability & Longevity

Code written against standard APIs written 10 years ago still compiles and runs without modification today. Code written against third-party frameworks from 5 years ago is often completely obsolete or requires a ground-up refactor. If longevity matters for your platform, minimizing external churn is the single most effective architectural decision you can make.

### 4. Where to Draw the Line

Zero dependencies is a guiding north star, not a dogmatic jail. Complex domain problems like TLS termination, cryptography primitives, or OS-level device drivers deserve well-audited open-source libraries. But for application logic, UI rendering, string manipulation, and HTTP routing, standard tools are almost always sufficient.

In conclusion, before installing a new package, ask yourself: *Can I write this utility function myself in 10 minutes?* Nine times out of ten, the answer is yes.`,
                    tags: ["Engineering", "Architecture", "Minimalism"],
                    excerpt:
                        "Why removing dependencies often leads to better software.",
                },
            };
            let writings = defaultWritings;

            const writingList = document.getElementById("writing-list");
            const writingListUl = document.getElementById("writing-list-ul");
            const writingDetail = document.getElementById("writing-detail");

            function buildWritingList() {
                writingListUl.innerHTML = "";
                Object.entries(writings).forEach(([id, w]) => {
                    const li = document.createElement("li");
                    li.className = "writing-item";
                    li.innerHTML = `
          <div class="entry-main">
              <a onclick="showWritingDetail('${id}')">${w.title}</a>

        `;
                    writingListUl.appendChild(li);
                });
            }

            /* ── Navigation Logic ── */
            const views = {

            // ── Markdown entry loading ──
            //

            //   ---
            //   name: My Article
            //   year: 2026
            //   shortDesc: One-line summary.
            //   thumbnail: media/my-article/thumb.jpg
            //   audio: media/my-article/theme.mp3
            //   tech: Rust, Tokio, gRPC
            //   link: Source → | https://github.com/you/my-article
            //   link: Demo → | https://demo.example.com
            //   ---
            //
            //   The rest of the file is plain Markdown.
            //
            //   `audio` is optional — a looping background track that
            //   fades in when this entry's detail view opens and fades
            //   out when the user leaves it. A mute toggle appears in the
            //   bottom-right corner while it plays.
            //
            //   `thumbnail` is optional and shows on the right side of the
            //   entry in its list — it can be an image OR a video file
            //   (mp4, webm, ogg, mov, m4v). Video thumbnails autoplay
            //   muted and loop silently, like a GIF.
            //
            //   Video isn't a native Markdown thing, but it works the same
            //   way an image does — just point a normal image link at a
            //   video file and it renders as a real <video controls>
            //   player instead of an <img>:
            //     ![Gameplay clip](media/my-article/clip.mp4)
            //   Supported extensions: mp4, webm, ogg, mov, m4v.
            //
            // data/<kind>/index.json lists which slugs to load and in what
            // order, e.g. ["my-article", "another-article"].

            function parseFrontmatter(raw) {
                const match = raw.match(
                    /^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/,
                );
                if (!match) return { meta: {}, body: raw.trim() };
                const [, fmBlock, body] = match;
                const meta = {};
                const links = [];
                fmBlock.split("\n").forEach((line) => {
                    if (!line.trim()) return;
                    const linkMatch = line.match(/^link:\s*(.*)$/i);
                    if (linkMatch) {
                        const [label, url] = linkMatch[1]
                            .split("|")
                            .map((s) => s.trim());
                        if (label && url) links.push({ label, url });
                        return;
                    }
                    const kv = line.match(/^([a-zA-Z]+):\s?(.*)$/);
                    if (kv) meta[kv[1].trim()] = kv[2].trim();
                });
                if (links.length) meta.links = links;
                if (meta.tech)
                    meta.tech = meta.tech
                        .split(",")
                        .map((s) => s.trim())
                        .filter(Boolean);
                if (meta.tags)
                    meta.tags = meta.tags
                        .split(",")
                        .map((s) => s.trim())
                        .filter(Boolean);
                return { meta, body: body.trim() };
            }

            // Loads every entry for a given kind ("games", "articles", or "writing").
            // Returns null (signalling "use the built-in defaults") if the
            // index/manifest can't be fetched at all — e.g. running via
            // file:// with no local server.
            async function loadMarkdownEntries(kind) {
                let slugs;
                try {
                    const idxRes = await fetch(`data/${kind}/index.json`);
                    if (!idxRes.ok) return null;
                    slugs = await idxRes.json();
                } catch (e) {
                    console.info(
                        `Using built-in ${kind} data — data/${kind}/index.json wasn't reachable (serve this folder over http:// to load it, e.g. \`python3 -m http.server\`).`,
                    );
                    return null;
                }

                const result = {};
                for (const slug of slugs) {
                    try {
                        const res = await fetch(`data/${kind}/${slug}.md`);
                        if (!res.ok) continue;
                        const raw = await res.text();
                        const { meta, body } = parseFrontmatter(raw);
                        result[slug] = { ...meta, body };
                    } catch (e) {
                        console.warn(
                            `Skipping data/${kind}/${slug}.md — couldn't load or parse it.`,
                            e,
                        );
                    }
                }
                return result;
            }

            async function loadContentData() {
                const loadedGames = await loadMarkdownEntries("games");
                if (loadedGames) games = loadedGames;
                const loadedArticles = await loadMarkdownEntries("articles");
                if (loadedArticles) articles = loadedArticles;
                const loadedWritings = await loadMarkdownEntries("writing");
                if (loadedWritings) writings = loadedWritings;
            }

            (async function init() {
                await loadContentData();
                buildGamesList();
                buildArticlesList();
                buildWritingList();

                const initialHash = window.location.hash;
                if (!initialHash || initialHash === "#") {
                    navigateTo("home");
                } else if (initialHash.startsWith("#game/")) {
                    const id = initialHash.replace("#game/", "");
                    navigateTo("games");
                    showGameDetail(id);
                } else if (initialHash.startsWith("#article/")) {
                    const id = initialHash.replace("#article/", "");
                    navigateTo("articles");
                    showArticleDetail(id);
                } else if (initialHash.startsWith("#writing/")) {
                    const id = initialHash.replace("#writing/", "");
                    navigateTo("writing");
                    showWritingDetail(id);
                } else {
                    const viewName = initialHash.replace("#", "");
                    if (views[viewName]) navigateTo(viewName);
                }
            })();
        </script>
    </body>
</html>
